<title>Finish Screen Snapshot</title>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Cormorant+Garamond:wght@400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Big+Shoulders+Display:wght@600;700;800&family=Barlow:wght@400;500;600&family=Share+Tech+Mono&family=Libre+Franklin:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  /* Screen height MINUS the system bars. Every scroller inside a sheet was sized in plain vh,
     which in the app counts the strip behind the status bar and the strip behind the gesture bar
     as usable space - the viewport is cover-fit, so vh is the whole panel. A list capped at 56vh
     therefore came out about sixty pixels taller than the room it actually had, and the bottom of
     the sheet, buttons and all, sat under the gesture bar. Sizing off this instead gives back
     exactly what the bars take. */
  --usablevh:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  --bg:#07080e; --surface:#0e111b; --surface2:#151a28; --line:#242c40;
  --txt:#e9edf6; --txt2:#98a4bd; --txt3:#5f6b84;
  --go:#6fd9ff; --gold:#f0c96b;
  /* the matched-set grade. Every theme reads it as its accent; Forge splits them - iron
     for what you press, temper violet for the grade - and overrides this alone. */
  --match:var(--go);
  --r:14px;
  --sans:'Inter Tight',system-ui,sans-serif;
  /* --mono was defined as var(--mono) here - a cycle, which CSS treats as invalid - so
     every font-family:var(--mono) has always fallen through to the theme's own face
     (Barlow on Forge). That fallback IS the shipped look, so the line is gone rather
     than "fixed": defining a real monospace now would restyle 61 call sites at once.
     If numerals ever want a true mono, decide it on purpose. body.light still sets one. */
}
/* line-height is here for the same reason it is on the launch wordmark, and it matters more
   here because it is inherited by everything. line-height:normal asks the FONT how tall a line
   is, so every line box in the app is a different height before the webfonts land than after.
   Measured on the week board: each card grew 2px when Barlow arrived and the board grew 21px,
   with seven card-meta lines carrying most of it. The whole screen reflows under you at
   whatever moment the font finishes loading, which is the launch bumping.
   1.2 is what Barlow reports for normal, so the loaded screen is unchanged to the pixel; what
   changes is that the screen BEFORE it loads is now the same. Anything wanting different
   spacing already states its own line-height and still wins. */
::selection{background:color-mix(in srgb,var(--go) 45%,transparent);color:inherit;}
body{font-family:var(--sans);line-height:1.2;background:var(--bg);color:var(--txt);min-height:100vh;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;}
input,button,textarea{font-family:inherit;}
/* A long press on a phone is also the browser's own gesture for selecting text and raising
   the callout menu. The sheet opens under the finger mid-gesture, so the selection lands on
   whatever button arrived there - CANCEL - and paints it highlighted. Nothing in the app is
   prose worth selecting except what you type, so selection is off everywhere but the fields. */
html{-webkit-tap-highlight-color:transparent;}
/* Chrome reloads a page dragged down from the top, and a reload here is not a refresh - it is
   the splash, the boot, and the day you were halfway through re-read from storage. Scrolling
   up a list of what is coming next is exactly the gesture that triggers it, which is no way to
   lose your place mid-workout. The pull is off at the root; the inner scrollers are contained
   so reaching the top of a day or a sheet cannot hand the gesture back up to the page either.
   Nothing is lost by it - the worker serves documents network-first, so relaunching the app
   still picks up a new build. */
html,body{overscroll-behavior-y:none;}
#session,#make,.ovl,.lvl-list,.swaplist,.prog-wrap,.hscroll{overscroll-behavior-y:contain;}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
input,textarea,[contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default;}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;}

/* ---------- HOME ---------- */
/* The status bar sits ON the page in the Android build - the WebView draws edge to edge, which a
   browser tab never did - so the mark and the week title were under the notification icons.
   env() is 0 anywhere the window is already inset, so this changes nothing on the web. */
#home{max-width:600px;margin:0 auto;padding:calc(26px + env(safe-area-inset-top,0px)) 18px calc(80px + env(safe-area-inset-bottom,0px));}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.brandtxt{min-width:0;flex:1;}
@media(max-width:400px){.wordmark{font-size:23px;}}
.wordmark{font-family:'Bricolage Grotesque',sans-serif;font-size:26px;font-weight:800;letter-spacing:-.035em;color:var(--txt);line-height:1;}
/* Temporary build tag. Small, quiet, and never inheriting the theme's display face. */
.vtag{font-family:var(--mono);font-size:10px;font-weight:400;letter-spacing:.06em;color:var(--txt3);
  vertical-align:super;margin-left:7px;opacity:.7;}
.tagline{font-size:12px;color:var(--txt3);margin-top:5px;letter-spacing:-.005em;}
.storenote{font-size:11px;color:var(--txt3);margin:16px 0 0;}
.sec-label{font-family:'Bricolage Grotesque',sans-serif;font-size:13px;font-weight:600;letter-spacing:-.01em;color:var(--txt2);margin:26px 0 12px;}
.iconbtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;color:var(--txt2);flex-shrink:0;transition:.15s;}
.iconbtn:hover{color:var(--txt);border-color:#33373d;}

/* Three levels on the board (v5.136): the ground, the day panel, the card. The card sits a step
   lighter than its day with a lit top edge and a soft drop beneath, so the edges read. */
.card{position:relative;border:1px solid color-mix(in srgb,var(--line) 62%,#9a6a48);border-radius:var(--r);background:var(--surface2);box-shadow:inset 0 1px 0 rgba(255,205,160,.09),0 5px 14px -8px rgba(0,0,0,.7);padding:9px 12px;cursor:pointer;transition:transform .12s,border-color .15s,background .15s;margin-bottom:6px;user-select:none;overflow:hidden;}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c);}
.card:hover{border-color:color-mix(in srgb,var(--c) 45%,var(--line));background:color-mix(in srgb,var(--surface2) 88%,#fff);transform:translateY(-1px);}
.card:active{transform:scale(.994);}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:0;}
/* The name shares the top line with the grip now, so it must not wrap the row taller than the
   grip - a long day name ellipses instead. */
.card-top .card-name{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-r{display:flex;gap:8px;align-items:center;flex:0 0 auto;}
.card-day{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--c);}
.card-name{font-family:'Bricolage Grotesque',sans-serif;font-size:18px;font-weight:600;letter-spacing:-.022em;color:var(--txt);line-height:1.2;}
.card-meta{font-size:12px;color:var(--txt3);margin-top:2px;}
.card.opt::before{background:repeating-linear-gradient(180deg,var(--c) 0 6px,transparent 6px 11px);}
.card.opt .card-name{color:var(--txt2);}
/* Today is now the whole card rather than a pill in the corner - you find the row you want
   by looking, not by reading four labels. */
.card.today{border-color:color-mix(in srgb,var(--c) 55%,var(--line));
  background:color-mix(in srgb,var(--c) 8%,var(--surface));
  box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 14%,transparent),0 6px 22px -16px var(--c);}
.card.today::before{width:5px;}
.card.today .card-day{text-shadow:0 0 11px color-mix(in srgb,var(--c) 60%,transparent);}
.pill{font-size:10.5px;font-weight:600;padding:4px 9px;border-radius:7px;letter-spacing:.04em;white-space:nowrap;}
.pill-today{background:var(--c);color:#0b0c0e;}
.pill-live{background:var(--go);color:#0b0c0e;}
.pill-ready{background:color-mix(in srgb,var(--go) 15%,transparent);color:var(--go);}
/* a passed day still undone: quiet, outlined, not a scolding */
.pill-wait{background:transparent;border:1px solid color-mix(in srgb,var(--txt3) 55%,transparent);color:var(--txt3);}
.card.waiting .card-name{color:var(--txt2);}
/* Level up: a lit arrow rather than a word. The old RISE/ASCEND/HEAT labels made you read
   four different nouns to find the one day that was ready. */
.lvl{display:inline-flex;align-items:center;justify-content:center;width:27px;height:27px;border-radius:9px;
  border:1px solid color-mix(in srgb,var(--go) 45%,transparent);cursor:pointer;
  background:color-mix(in srgb,var(--go) 12%,transparent);color:var(--go);
  position:relative;transition:background .15s;}
/* position + z-index: the pulsing ::after below is absolutely positioned and paints AFTER the
   in-flow svg, so on the phone the arrow sometimes vanished under it until a scroll repainted
   the card (seen 12 Sep). Lifting the arrow above the glow layer ends that. */
.lvl svg{width:13px;height:13px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round;position:relative;z-index:1;}
.lvl:hover{background:color-mix(in srgb,var(--go) 24%,transparent);}
.lvl:active{transform:scale(.94);}
/* box-shadow inside @keyframes is the other cause named at the top of the ground rules, and
   this is where it was still living: a ready day sits on the board doing this forever. The lit
   state is now a bare pseudo-element holding the wide shadow at full strength, and the pulse
   is its opacity. Nothing under it repaints. */
.lvl::after{content:'';position:absolute;inset:0;border-radius:9px;pointer-events:none;
  box-shadow:0 0 13px 1px color-mix(in srgb,var(--go) 45%,transparent);
  opacity:0;will-change:opacity;animation:lvlpulse 2.8s ease-in-out infinite;}
@keyframes lvlpulse{0%,100%{opacity:0;}50%{opacity:1;}}
/* while the transfer plays, the sheet's actions are out of reach - a tap that lands between
   the animation and the write leaves the two decisions fighting over the same targets */
#lvlOvl.busy .sheet-btns{pointer-events:none;opacity:.4;}
/* Building a day was only reachable by holding a card, which is not discoverable. */
.mk-new{margin-top:14px;padding:15px;border:1px dashed color-mix(in srgb,var(--go) 40%,var(--line));
  border-radius:var(--r);text-align:center;cursor:pointer;color:var(--go);
  font-size:12px;font-weight:600;letter-spacing:.14em;background:color-mix(in srgb,var(--go) 4%,transparent);
  display:flex;align-items:center;justify-content:center;gap:9px;transition:background .15s,border-color .15s;}
.mk-new:hover{background:color-mix(in srgb,var(--go) 9%,transparent);border-color:color-mix(in srgb,var(--go) 65%,var(--line));}
.mk-new:active{transform:scale(.995);}
.mk-new svg{width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;}
.slotrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 13px;
  border:1px solid var(--line);border-radius:11px;background:var(--surface2);cursor:pointer;}
.slotrow:hover{border-color:color-mix(in srgb,var(--go) 45%,var(--line));}
.slotrow.off{opacity:.42;cursor:default;}
.slotrow .sd{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--txt3);width:34px;flex-shrink:0;}
.slotrow .sn{font-size:13.5px;color:var(--txt);min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.slotrow .sm{font-size:11px;color:var(--txt3);flex-shrink:0;}
.lvl-list{max-height:calc(var(--usablevh) * .46);overflow-y:auto;overflow-x:hidden;margin:8px 0 4px;display:flex;flex-direction:column;gap:9px;}
.lvl-row{border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--surface2);}
.lvl-n{font-size:13.5px;font-weight:600;color:var(--txt);margin-bottom:6px;}
.lvl-d{display:flex;flex-wrap:wrap;gap:5px 15px;white-space:nowrap;font-size:12.5px;color:var(--txt3);font-variant-numeric:tabular-nums;}
.lvl-d b{font-weight:600;color:var(--txt2);}
/* The offer is a BUTTON and wears it: chip border, tint, and a pencil. A bare colored
   number said "result"; nobody presses a result. Reported from the device the day it
   shipped bare. */
.lvl-d b.up{color:var(--go);cursor:pointer;display:inline-flex;align-items:center;gap:5px;
  padding:3px 8px;margin:-3px 0;border-radius:7px;
  border:1px solid color-mix(in srgb,var(--go) 45%,var(--line));
  background:color-mix(in srgb,var(--go) 10%,transparent);}
.lvl-d b.up:hover{background:color-mix(in srgb,var(--go) 18%,transparent);}
.lvl-d b.up svg{width:11px;height:11px;stroke:currentColor;stroke-width:1.8;fill:none;
  stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;opacity:.8;}
.lvl-d .mk-sr.open{margin:-2px 0;}
.lvl-d .mk-num.sm{font-size:13px;}
/* Raising targets: the old number gives up its charge, a spark crosses the arrow, the new
   number takes it. Staggered down the list so it reads as one wave rather than a flash. */
.lvl-d span{position:relative;}
.lvl-d b{display:inline-block;transition:none;}
.lvl-row.xfer .lvl-d b:not(.up){animation:drain .5s ease-in forwards;animation-delay:var(--sd);}
.lvl-row.xfer .lvl-d b.up{animation:charge .62s cubic-bezier(.3,1.5,.4,1) forwards;animation-delay:calc(var(--sd) + .26s);}
.lvl-row.xfer .lvl-n{animation:namelift .7s ease forwards;animation-delay:var(--sd);}
.lvl-row.xfer{animation:rowlift .7s ease forwards;animation-delay:var(--sd);}
.lvl-spark{position:absolute;top:50%;left:0;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;
  background:var(--go);box-shadow:0 0 9px 2px var(--go);opacity:0;pointer-events:none;}
.lvl-row.xfer .lvl-spark{animation:sparkgo .56s cubic-bezier(.45,0,.3,1) forwards;animation-delay:calc(var(--sd) + .1s);}
@keyframes drain{to{color:var(--txt3);opacity:.34;transform:scale(.9);}}
@keyframes charge{
  0%{transform:scale(1);text-shadow:none;}
  45%{transform:scale(1.34);text-shadow:0 0 16px var(--go),0 0 34px color-mix(in srgb,var(--go) 60%,transparent);}
  100%{transform:scale(1.08);text-shadow:0 0 11px color-mix(in srgb,var(--go) 55%,transparent);}}
@keyframes sparkgo{
  0%{opacity:0;transform:translateX(var(--x0)) scale(.5);}
  18%{opacity:1;}
  75%{opacity:1;}
  100%{opacity:0;transform:translateX(var(--x1)) scale(1.5);}}
@keyframes rowlift{
  0%{border-color:var(--line);}
  40%{border-color:color-mix(in srgb,var(--go) 60%,transparent);box-shadow:0 0 22px -6px var(--go);}
  100%{border-color:color-mix(in srgb,var(--go) 34%,transparent);box-shadow:none;}}
@keyframes namelift{0%,100%{color:var(--txt);}45%{color:var(--go);}}
@media(prefers-reduced-motion:reduce){
  .lvl-row.xfer .lvl-d b:not(.up),.lvl-row.xfer .lvl-d b.up,.lvl-row.xfer,.lvl-row.xfer .lvl-n,.lvl-spark{animation-duration:.01s;}}
.foot{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--txt3);line-height:1.75;}
.foot a{color:var(--txt2);cursor:pointer;text-decoration:none;border-bottom:1px solid var(--line);}
.foot a:hover{color:var(--txt);}

/* ---------- REORDER ---------- */
.blk{position:relative;transition:transform .19s cubic-bezier(.2,0,.2,1);}
/* Day cards reorder by grabbing the grip, the same held-press the exercise handle uses. The
   others slide to open a gap rather than a line marking the spot - the cards are all one height,
   so the gap is unambiguous and reads as the place it will land. */
/* Its own zone, and a big one. The grip was a 17px icon with no padding, so a thumb aiming for it
   landed on the card and got the hold menu instead. The negative margins let the touch target grow
   to about 44px without the card-top changing height, and the rule underneath is the visible edge
   of it - press left of the line for the menu, on the line for dragging.
   pointer-events:none on the svg is the other half: without it the finger lands on a <path>, and
   the card's own handler cannot tell that is the grip. */
.carddrag{display:inline-flex;align-items:center;padding:13px 4px 13px 13px;margin:-13px -4px -13px 6px;
  border-left:1px solid var(--line);color:var(--txt2);opacity:.6;touch-action:none;cursor:grab;}
.carddrag:active{opacity:1;color:var(--go);}
.carddrag svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;pointer-events:none;}
.card.cdrag{z-index:60;opacity:.96;transition:none;box-shadow:0 20px 44px -14px rgba(0,0,0,.6);pointer-events:none;}
/* The space the card will drop into. It is a real element in the list, so everything below it
   moves down to make room - which is the animation, without animating anything. */
.dropslot{border:1px dashed color-mix(in srgb,var(--go) 60%,var(--line));border-radius:var(--r);
  background:color-mix(in srgb,var(--go) 12%,transparent);margin-bottom:9px;}
/* A day is a container: header, then whatever is in it, growing and shrinking to fit. An empty
   one keeps its header and offers somewhere to drop, because empty is a real answer - it is a
   rest day - not an absence. */
.daybox{border:1px solid color-mix(in srgb,var(--line) 78%,#8a5a3a);border-radius:14px;padding:7px 8px 1px;margin-bottom:7px;
  background:color-mix(in srgb,var(--surface) 82%,var(--bg));transition:border-color .15s,background .15s;}
/* A day holding a workout is solid (v5.120); only an empty day is clear. Done days keep their own quenched look. */
.daybox.empty{padding-bottom:7px;background:transparent;border-style:dashed;}
.dayhead{display:flex;align-items:center;justify-content:space-between;gap:10px;
  font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--txt3);padding:1px 3px 6px;}
.daybox.today .dayhead{color:var(--go);}
/* Today is the DAY, not the workout. A day can hold two, and lighting one of them said the wrong
   thing about the other; the box they sit in is what you are looking for anyway.
   The light travels the whole border - a conic gradient rotating behind the box, showing only in
   the pixel and a half it sticks out past the edge. The box paints its own background over the
   middle, so what is left is a ring. Rotation is a transform on a layer painted once, so it
   composites; the box-shadow pulse this replaces was a paint property on every card. */
.daybox.today{position:relative;
  background:linear-gradient(color-mix(in srgb,var(--surface) 45%,transparent),color-mix(in srgb,var(--surface) 45%,transparent)),var(--bg);
  border-color:color-mix(in srgb,var(--go) 30%,var(--line));}
/* 1.5px of ring at half strength was invisible on the phone. Three and a half, at full strength,
   with a second arc chasing the first so some edge is always lit and the movement reads even
   when you catch it out of the corner of your eye. */
.daybox.today > .dayglow{position:absolute;inset:-3.5px;border-radius:17px;overflow:hidden;
  pointer-events:none;z-index:-1;}
/* The two arcs turn inside a rounded overflow:hidden box. Unpromoted, that clip has to be
   re-applied to whatever is inside it on every frame either arc moves - and one of these is on
   the board from the moment the launch ends until the day rolls over. Given their own layers,
   the conic gradients are rastered once and the turn is a composited transform under a clip
   the compositor applies for free. */
.daybox.today > .dayglow::before,.daybox.today > .dayglow::after{content:'';position:absolute;
  left:50%;top:50%;width:180%;aspect-ratio:1;transform-origin:0 0;
  will-change:transform;backface-visibility:hidden;}
.daybox.today > .dayglow::before{
  background:conic-gradient(from 0turn,transparent 0 .02turn,color-mix(in srgb,var(--go) 70%,transparent) .09turn,#fff .15turn,color-mix(in srgb,var(--go) 70%,transparent) .21turn,transparent .3turn 1turn);
  animation:dayspin 4.2s linear infinite;}
/* the chase: dimmer, half a turn behind, so the ring is never fully dark anywhere */
.daybox.today > .dayglow::after{opacity:.5;
  background:conic-gradient(from .5turn,transparent 0 .04turn,color-mix(in srgb,var(--go) 45%,transparent) .12turn,color-mix(in srgb,var(--go) 90%,#fff) .16turn,color-mix(in srgb,var(--go) 45%,transparent) .2turn,transparent .28turn 1turn);
  animation:dayspin 4.2s linear infinite;}
@keyframes dayspin{from{transform:translate(-50%,-50%) rotate(0turn);}to{transform:translate(-50%,-50%) rotate(1turn);}}
/* Forge runs molten - slower, hotter in the core, and trailing ember behind the head of it. */
/* The ring is lit the whole way round now. It was a bright head with everything behind it fully
   transparent, so at any moment about a third of the border carried light and the rest was dark
   border - which reads as the glow only going part of the way rather than travelling a circuit.
   The head is unchanged; what follows it is a long ember tail that never quite dies before it
   meets the head again, so the whole edge is hot and the bright part is what moves. */
body.forge .daybox.today > .dayglow::before{
  background:conic-gradient(from 0turn,rgba(196,62,10,.30) 0 .02turn,rgba(196,62,10,.55) .06turn,#ff6a12 .11turn,#ff8a1f .14turn,#fff0cd .165turn,#ff8a1f .19turn,rgba(255,90,10,.5) .25turn,rgba(196,62,10,.34) .45turn,rgba(160,48,8,.26) .72turn,rgba(196,62,10,.30) 1turn);
  animation-duration:3.4s;}
body.forge .daybox.today > .dayglow::after{animation-duration:3.4s;opacity:.45;}

body.forge .daybox.today{border-color:color-mix(in srgb,#ff8a1f 42%,var(--line));}
/* Moonwell is light passing over: long, cool, never fully bright. */
body.moon .daybox.today > .dayglow::before{
  background:conic-gradient(from 0turn,transparent 0 .05turn,rgba(214,206,255,.5) .13turn,rgba(245,242,255,.92) .17turn,rgba(214,206,255,.45) .21turn,transparent .3turn 1turn);
  animation-duration:5.6s;}
body.moon .daybox.today > .dayglow::after{animation-duration:5.6s;opacity:.45;}

/* Tundra is a glint on ice: a short hard flash and a long wait between. */
body.light .daybox.today > .dayglow::before{
  background:conic-gradient(from 0turn,transparent 0 .1turn,rgba(255,255,255,.95) .15turn,transparent .2turn 1turn);
  animation-duration:4.8s;}
body.light .daybox.today > .dayglow::after{animation-duration:4.8s;opacity:.45;}

.daycount{font-size:11px;letter-spacing:.1em;color:var(--txt3);}
.dayempty{font-size:12.5px;color:var(--txt3);padding:6px 4px 4px;}
/* An empty day is a way in, not a caption. Same dashed language as the New day button so the two
   read as the same offer in two places. */
.dayempty.dayadd{display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;
  color:var(--go);opacity:1;padding:11px 4px;border-radius:10px;
  border:1px dashed color-mix(in srgb,var(--go) 34%,var(--line));transition:.15s;}
.dayempty.dayadd:hover{background:color-mix(in srgb,var(--go) 8%,transparent);
  border-color:color-mix(in srgb,var(--go) 60%,var(--line));}
.dayempty.dayadd:active{transform:scale(.99);}
.inp.pl-landed{border-color:var(--go);box-shadow:0 0 0 2px color-mix(in srgb,var(--go) 30%,transparent);transition:box-shadow .6s,border-color .6s;}
.dayempty.dayadd.quiet{padding:8px 4px;color:color-mix(in srgb,var(--go) 70%,var(--txt3));}
.dayempty.dayadd svg{width:13px;height:13px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;flex-shrink:0;}
/* a day with no room left still shows, so the grid keeps its shape and you can see WHY */
.mk-slot.full{opacity:.42;cursor:default;}
.mk-slot.full:hover{border-color:var(--line);}
/* Where it will land, and whether it can. */
.daybox.dropok,#extraCards.dropok{border-color:var(--go);background:color-mix(in srgb,var(--go) 9%,transparent);}
.daybox.dropfull,#extraCards.dropfull{border-color:var(--bad,#c2554a);background:color-mix(in srgb,#c2554a 10%,transparent);}
/* The bank is a real place now: a box of its own under the week, dashed where the day
   boxes are solid so it reads as storage rather than another day, and always present so
   there is always somewhere visible to drag a workout out of the week. */
#extraCards{border-radius:14px;padding:7px 8px 1px;transition:border-color .15s,background .15s;
  border:1px dashed color-mix(in srgb,var(--go) 30%,var(--line));

.bank-empty{font-size:12px;color:var(--txt3);text-align:center;padding:13px 10px;line-height:1.55;margin-bottom:6px;}
/* the Saved fold header (v5.138) */
.sv-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:26px 0 10px;}
.sv-tog{display:flex;align-items:center;gap:8px;background:none;border:0;padding:6px 4px 6px 0;margin:0;color:inherit;cursor:pointer;font:inherit;}
.sv-head .sec-label{margin:0;}
.sv-chev{width:16px;height:16px;fill:none;stroke:var(--txt3);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s;transform:rotate(-90deg);}
.sv-head.open .sv-chev{transform:rotate(0deg);}
.sv-acts{display:flex;gap:8px;align-items:center;}
.sv-btn{height:32px;min-width:32px;padding:0 8px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--txt2);display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font:inherit;font-size:11px;letter-spacing:.06em;text-transform:uppercase;transition:.15s;}
.sv-btn:hover{color:var(--txt);border-color:#33373d;}
.sv-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;}
.sv-forge{color:var(--go);border-color:color-mix(in srgb,var(--go) 34%,var(--line));}
#svForgeIco{width:19px;height:19px;fill:currentColor;stroke:none;}
#extraCards[hidden],#extraHint[hidden]{display:none;}
.bank-add{display:flex;align-items:center;justify-content:center;padding:9px;margin:2px 0 6px;
  border:1px dashed color-mix(in srgb,var(--go) 34%,var(--line));border-radius:11px;color:var(--go);
  cursor:pointer;transition:background .15s;}

.bank-forge{gap:7px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;}
.bank-forge svg{width:17px;height:17px;stroke-width:1.6;}
/* the two week program control under Saturday, and the flip itself */
.two-ctl{gap:8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-top:10px;}
.two-ctl svg{width:17px;height:17px;stroke-width:1.6;}
.sec-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:26px 0 12px;}
.sec-row .sec-label{margin:0;}
.wk-flip{display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--txt2);border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 10px;cursor:pointer;white-space:nowrap;transition:.15s;}
.wk-flip:hover{color:var(--txt);border-color:#33373d;}
.wk-flip[hidden]{display:none;}
.wk-flip svg{width:15px;height:15px;stroke-width:1.6;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;}
/* The perspective lives INSIDE the transform, never on #home: a perspective on the home
   screen made it the containing block for every fixed sheet inside it (Settings landed
   offset) and let the page scroll sideways (v5.113, seen on the phone). */
#weekCards{transform-origin:50% 50%;}
#weekCards.flip-out{animation:flipout .26s cubic-bezier(.55,0,.8,.4) forwards;}
#weekCards.flip-in{animation:flipin .40s cubic-bezier(.2,.7,.2,1) both;}
@keyframes flipout{from{transform:perspective(1400px) rotateY(0);opacity:1;}to{transform:perspective(1400px) rotateY(88deg);opacity:.35;}}
@keyframes flipin{from{transform:perspective(1400px) rotateY(-88deg);opacity:.35;}to{transform:perspective(1400px) rotateY(0);opacity:1;}}
@media (prefers-reduced-motion:reduce){#weekCards.flip-out,#weekCards.flip-in{animation:none;}}
.blk.dragging{z-index:60;opacity:.94;transition:none;}
.blk.dragging .exc{box-shadow:0 20px 44px -14px rgba(0,0,0,.65);}
/* While a block is being dragged the whole list collapses to name rows: a three-deep
   superset becomes a short stack and the day fits on screen while the finger is down. */
#sBody.rearrange .exc>*:not(.ex-h),
#sBody.rearrange .ex-note,#sBody.rearrange .ex-stats,#sBody.rearrange .ex-links,
#sBody.rearrange .ex-tools,
#sBody.rearrange .notebox,#sBody.rearrange .finish-inline,#sBody.rearrange .mk-new{display:none;}
#sBody.rearrange{padding-bottom:24vh;}
#sBody.rearrange .ex-h{padding:10px 13px;}
#sBody.rearrange .ex-nrow{align-items:center;}
#sBody.rearrange .ex-n{font-size:14px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#sBody.rearrange .exc{margin-bottom:5px;}
#sBody.rearrange .blk .exc~.exc{margin-top:-2px;}
#sBody.rearrange .sect-t{padding:11px 2px 5px;}
#sBody.rearrange .ssgrp{padding:4px;margin-bottom:5px;}
#sBody.rearrange .ssgrp .exc{margin-bottom:4px;}
.exdrag{display:flex;align-items:center;justify-content:center;width:26px;height:30px;border-radius:9px;margin-left:-7px;
  cursor:grab;touch-action:none;color:var(--txt3);flex-shrink:0;transition:.15s;}
.exdrag:hover{color:var(--txt2);background:var(--surface2);}
.exdrag:active{cursor:grabbing;}
.exdrag svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;fill:none;}
#blkMark{position:fixed;height:2px;background:var(--go);z-index:61;pointer-events:none;display:none;border-radius:2px;
  box-shadow:0 0 12px color-mix(in srgb,var(--go) 65%,transparent);}

/* ---------- EXERCISE EDIT ---------- */
.exed-n{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center;}
.exed-n .preset{font-size:17px;padding:11px 0;}
#exEdSets{font-family:var(--mono);font-size:24px;color:var(--txt);}
.exed-sub{font-size:11.5px;color:var(--txt3);margin-top:7px;line-height:1.5;text-wrap:pretty;}
.exed-off{opacity:.4;pointer-events:none;}

/* ---------- TUTORIAL ---------- */
/* The scrim was one box with a 9999px spread shadow, which asks Chrome to paint a box some
   twenty thousand pixels across and repaint it every time the spotlight moves - the flicker
   on opening the tour and on every step. It is four plain rectangles around the hole
   instead: same picture, nothing oversized, and each one a flat fill. They are fixed, so
   they sit against the viewport regardless of the hole's own size, and they inherit the
   hole's fade. Nothing here may take a transform or a filter or they would stop doing that. */
#tutHole{position:fixed;top:0;left:0;width:0;height:0;z-index:400;pointer-events:none;border-radius:14px;
  border:1.5px solid var(--go);opacity:0;transition:opacity .25s;}
/* Lighter than it was. At .78 the surroundings went practically black, which is fine when the
   step points at one control and wrong when it points at one SECTION of a sheet you are meant to
   be reading the rest of. The ring does the pointing; the scrim only has to say "not this bit". */
#tutHole > i{position:fixed;display:block;background:rgba(4,5,7,.58);pointer-events:none;}
/* One step (the rest pill) asks for deeper dark: the pill floats over the session's own
   rows, and the normal scrim left them loud enough to fight it. */
#tutHole.deep > i{background:rgba(4,5,7,.82);}
#tutHole.on{opacity:1;}
/* A one-shot entrance: the highlight is planted around the whole viewport and closes onto the
   step's target, so the week is taken in whole before any one day is singled out. Geometry
   and deliberately not transform - the scrim rectangles are position:fixed children of the
   hole, and a transform here would make it their containing block and tear them off the
   viewport, which is the same reason nothing else on this element may take one. It is the
   identical write the tour already makes on every frame a target moves, so it asks nothing
   new of the screen, and the class comes off the moment it lands. */
#tutHole.sweep,#tutHole.sweep > i{transition:top .62s cubic-bezier(.32,.86,.36,1),
  left .62s cubic-bezier(.32,.86,.36,1),width .62s cubic-bezier(.32,.86,.36,1),
  height .62s cubic-bezier(.32,.86,.36,1);}
/* Measured on the phone: the highlight moved between steps as a single-frame cut, up to 639px at
   once - three quarters of the closed screen, instantly. Nothing was dropped and nothing was slow;
   the tour held a flat 8.3ms frame the whole way. It was a cut where the eye expects a move, and
   that is what reads as a skip.
   Glide is armed for the length of a step change and taken straight off again, because the same
   geometry is rewritten on EVERY frame that a target moves - a transition left on permanently
   would make the ring lag behind anything it tracks through a scroll. Shorter than the sweep:
   this is the ring following the step, not the tour announcing a journey. */
#tutHole.glide,#tutHole.glide > i{transition:top .28s cubic-bezier(.32,.86,.36,1),
  left .28s cubic-bezier(.32,.86,.36,1),width .28s cubic-bezier(.32,.86,.36,1),
  height .28s cubic-bezier(.32,.86,.36,1);}
@media(prefers-reduced-motion:reduce){#tutHole.sweep,#tutHole.sweep > i,
  #tutHole.glide,#tutHole.glide > i{transition:none;}}
/* The pulsing ring sits on the one control the step wants tapped, so a lit panel still
   points at something specific. The pulse is a scaling pseudo-ring rather than an animated
   box-shadow: a shadow is a paint property, so that ring was repainting every frame it was
   on screen for the whole length of the tour. */
#tutPing{position:fixed;top:0;left:0;width:0;height:0;z-index:400;pointer-events:none;border-radius:12px;
  border:2px solid var(--go);opacity:0;}
#tutPing::after{content:'';position:absolute;inset:-4px;border-radius:15px;pointer-events:none;
  border:3px solid color-mix(in srgb,var(--go) 30%,transparent);}
/* The pulse is armed with the ring rather than declared on it. Unarmed, #tutPing is a 0x0 box
   at opacity 0 that nothing can see - but the animation on its pseudo-element ran anyway, from
   load until close, on every screen in the app, for a tour that was not running. Invisible is
   not the same as absent: an animation on a hidden element still ticks. */
#tutPing.on::after{animation:tutping 1.5s ease-in-out infinite;}
#tutPing.on{opacity:1;}
@keyframes tutping{0%,100%{transform:scale(1);opacity:.95;}
  50%{transform:scale(1.07);opacity:.2;}}
/* The card must not read as another layer of the surface it is explaining, so it takes a
   tint of the live colour and a brighter rim than any sheet in the app. */
/* The card is capped and scrolls inside itself. A step whose card is pinned to the top of the
   screen to clear the sheet it is describing - the exercise sheet is the tall one - could grow
   past the top of the viewport and lose its first lines with no way to get them back. It can be
   as long as it likes now; past this it scrolls, and the insets keep it clear of the system bars
   at both ends rather than only the notch. */
/* The card is ANCHORED, not placed: bottom edge pinned to the foot of the screen in CSS,
   and no script ever writes its position. Every attempt to move it gracefully - fades,
   settle gates, seat rules - still read as "the window keeps moving" on the device,
   because it kept moving. Now it cannot. Content changes grow it upward from a fixed
   bottom edge, and the SCENE arranges itself around the card instead: targets scroll to
   the upper part, the rest pill docks at the top for the tour, and the tall sheets wear
   a tour scale. */
#tutCard{position:fixed;z-index:401;left:50%;transform:translateX(-50%);
  bottom:calc(14px + env(safe-area-inset-bottom,0px));
  transition:opacity .16s ease;
  width:min(430px,calc(100vw - 26px));border-radius:var(--r);padding:16px 17px 14px;display:none;
  max-height:calc(100vh - 28px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  overflow-y:auto;overscroll-behavior:contain;
  background:linear-gradient(180deg,color-mix(in srgb,var(--go) 15%,var(--surface2)),color-mix(in srgb,var(--go) 7%,var(--surface2)));
  border:1px solid color-mix(in srgb,var(--go) 45%,var(--line));
  box-shadow:0 22px 50px -14px rgba(0,0,0,.8),0 0 0 1px rgba(0,0,0,.35);}
#tutCard.on{display:block;}
#tutCard.shake{animation:tutshake .46s;}
@keyframes tutshake{
  15%{transform:translateX(calc(-50% - 8px))}35%{transform:translateX(calc(-50% + 7px))}
  55%{transform:translateX(calc(-50% - 5px))}75%{transform:translateX(calc(-50% + 3px))}
  100%{transform:translateX(-50%)}}
.tut-step{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--go);margin-bottom:8px;}
.tut-t{font-size:18px;margin-bottom:7px;color:var(--txt);}
.tut-b{font-size:13.5px;line-height:1.62;color:var(--txt);opacity:.88;text-wrap:pretty;}
.tut-b ul{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;}
.tut-b li{display:flex;gap:9px;align-items:flex-start;}
.tut-b li::before{content:'';flex:0 0 4px;width:4px;height:4px;border-radius:50%;background:var(--go);margin-top:8px;}
.tut-b p{margin:9px 0 0;}
/* the three grades named by their own colours rather than described in a paragraph */
/* The grade key, at the top of a day. It was a tutorial step, which is the one place it is no
   use: three colours explained once are three colours forgotten by the tenth session. It sits
   above the first exercise instead, small enough to read past and there whenever it is wanted. */
.gradekey{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;
  margin:0 0 14px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;
  background:color-mix(in srgb,var(--surface) 60%,transparent);}
.gradekey span{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.04em;color:var(--txt3);}
.gradekey i{width:9px;height:9px;border-radius:3px;flex:0 0 9px;}
.tut-g{display:flex;flex-direction:column;gap:7px;margin:3px 0 10px;}
.tut-g div{display:flex;gap:10px;align-items:center;}
.tut-g i{flex:0 0 13px;width:13px;height:13px;border-radius:4px;}
.tut-g b{font-weight:500;color:var(--txt);}
.tut-back{background:transparent!important;color:var(--txt2)!important;padding-left:9px!important;padding-right:9px!important;}
/* The week is the one screen the tour has to show whole - and it grew. This was written when the
   week was seven flat cards; it is seven day CONTAINERS now, each with a header and a card inside
   it, and half again as tall. At .76 the last two days sat behind the tour card while the step
   was telling you to take all seven in.
   Shrinking the type further was the wrong answer - it was already at 13px. The week drops to an
   OVERVIEW for the length of the tour instead: the size line goes, the padding tightens, and what
   is left is a day and what is on it, which is all these steps are pointing at. That buys enough
   back to sit at a scale where the names are still readable. */
body.tut #weekCards{transform:scale(.8);transform-origin:50% 0;}
body.tut #weekCards .daybox{padding:6px 8px 1px;margin-bottom:4px;}
body.tut #weekCards .daybox.empty{padding-bottom:6px;}
body.tut #weekCards .dayhead{font-size:10px;padding:1px 3px 5px;}
body.tut #weekCards .card{padding:7px 11px;margin-bottom:5px;}
body.tut #weekCards .card-name{font-size:15px;}
body.tut #weekCards .card-meta{display:none;}
body.tut #weekCards .dayempty{padding:3px 4px 2px;font-size:11.5px;}
/* the tagline is the first thing to go: it is the one line up there that says nothing the tour
   has not already said, and it is holding the whole week down the screen */
body.tut #tagline{display:none;}
/* The Forge embers used to have a second home here, six hundred lines above the rules that
   actually draw them, and it was doing nothing at all. A later @keyframes of the same name
   replaces an earlier one outright, and the later box-shadow won on document order, so the
   rewrite of the rise curve and the halo that was written here never reached the screen - the
   embers went on running the original way while two builds in a row reported them changed.
   Nothing lives here now. The motes are described once, beside the other three grounds. */
/* The rest pill belongs to a session. On the week board it was a clock floating over a screen
   with nothing to time, and leaving a day mid-rest is not a reason to keep it hovering there.
   The countdown is in the notification shade the whole time, so nothing is lost by it going. */
body:not(:has(#session.on)) #timerPill{display:none;}
/* The export is the tallest thing the tour stops on: tiles, then the whole session written out.
   At full size the step was a scroll rather than a look, and a step you have to scroll through
   is one you skim. Scaled down for the length of the tour it fits in a screen, which is all this
   step needs - it is showing you that the thing exists and what is in it, not asking you to read
   the text of a session you just did. */
/* .76, down from .84 (user note, Aug 23): at .84 the sheet's last rows tucked behind the
   anchored card, cutting off the caption and the COPY and CLOSE buttons. At .76 the whole
   sheet stands clear above the card. */
body.tut #exportOvl .sheet{transform:scale(.76);transform-origin:50% 0;}
/* The exercise sheet gets the same treatment for the same reason: it must fit in the
   space above the anchored card, save row included. */
body.tut #exEditOvl .sheet{transform:scale(.82);transform-origin:50% 0;}
/* Scroll room, measured not generous (user note, Aug 23: 44vh floated the finish button to
   the middle of the screen over a gulf of nothing). 90px was tuned LIVE on the device: the
   scroll runs out with the button resting 40px above the anchored card - it reads as the
   page scrolling down to it, because that is all that happens. */
body.tut #home{padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:250px;}
body.tut #sBody{padding-bottom:90px;}
/* The rest pill normally floats at the very foot of the screen - the anchored card's seat.
   For the tour it sits directly ABOVE the card instead (--tutch is the card's live height,
   written by tutPlace): same corner of the world it always lives in, just lifted clear. */
/* The opaque ring seals the SLIVER (user note, Aug 23): the spotlight opening is a few
   pixels wider than the pill, and that undimmed fringe let the graded row behind peek
   through at the pill's edge. The ring fills the gap with solid dark, corner curves and
   all, so the opening reads as one finished piece. */
/* The anvil step starts the rest clock, but its pill arriving mid-step got cut by the card
   and the opening (user note, Aug 23). The step that STARTS the timer hides it; the step
   ABOUT the timer is where it appears, whole. */
body.tut-nopill .timer-pill{display:none!important;}
body.tut .timer-pill{bottom:calc(26px + env(safe-area-inset-bottom,0px) + var(--tutch,200px));
  box-shadow:0 0 0 9px rgb(4,5,7),0 10px 34px rgba(0,0,0,.55);}
/* The alert control, borrowed into the card. Narrower than the Settings one because it shares a
   row with its own label and value rather than sitting under a heading. */
.tut-fine{margin-top:7px;font-size:11.5px;line-height:1.5;color:var(--txt3);}
.tut-vol{margin-top:12px;gap:10px;}
.tut-vol .tut-vol-l{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--txt3);flex-shrink:0;}
.tut-vol .slider-num{min-width:44px;font-size:12px;}
/* NEXT was the same weight as End tour and HEAR IT, so the one button that always moves you on
   looked like one of three equal choices. It is the primary action of every step it appears on
   and it now says so - and it says what it DOES, which is how you tell a page turn from the
   thing itself. */
.tut-btns .btn-go{padding:13px 20px;font-size:13px;letter-spacing:.1em;font-weight:600;
  box-shadow:0 0 22px -8px color-mix(in srgb,var(--go) 85%,transparent);}
.tut-nudge{display:none;margin-top:10px;font-size:12px;line-height:1.5;color:var(--gold);
  border-top:1px solid color-mix(in srgb,var(--gold) 30%,transparent);padding-top:9px;}
.tut-nudge.on{display:block;}
.tut-btns{display:flex;gap:9px;margin-top:15px;align-items:center;justify-content:flex-end;}
.tut-btns .btn{padding:10px 13px;background:var(--surface);white-space:nowrap;}
/* BACK reads left-to-right as "go left": leftmost seat, arrow first. margin-right:auto pushes
   everything else to the right edge whether or not the waiting pill is between them. */
.tut-back{margin-right:auto;display:flex;align-items:center;gap:6px;}
.tut-back svg{width:12px;height:12px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;}
/* The way out. It was grey underlined text sitting next to a lit NEXT button, which made leaving
   look like a footnote - and someone who wants out of a tour wants to SEE the way out. It takes
   the same red the app already uses for anything that undoes or removes, per theme, so it reads
   as the exit without shouting over NEXT. Each world's value is the one its own .btn-bad uses. */
.tut-x{position:absolute;top:8px;right:8px;width:32px;height:32px;display:flex;align-items:center;
  justify-content:center;border-radius:9px;color:var(--txt3);cursor:pointer;transition:.14s;}
.tut-x:hover{color:#e0736b;background:color-mix(in srgb,#e0736b 10%,transparent);}
.tut-x svg{width:13px;height:13px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;}
/* The exit confirm has to stand over the tour's own chrome, which lives at 400+. */
body.tut #askOvl{z-index:402;}
.tut-wait{font-size:11.5px;color:var(--go);letter-spacing:.04em;display:flex;align-items:center;gap:8px;}
.tut-wait::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--go);animation:tutp 1.25s infinite;}
@keyframes tutp{0%,100%{opacity:.25;transform:scale(.75)}50%{opacity:1;transform:scale(1.2)}}

/* ---------- SESSION ---------- */
/* These are full-screen and fixed, so in the app build they run under both system bars: the
   session header disappeared behind the status bar and the foot of the list behind the
   navigation bar. env() is 0 on the web, so the browser layout is untouched. */
#session,#make{display:none;position:fixed;inset:0;background:var(--bg);overflow-y:auto;z-index:100;padding-bottom:calc(100px + env(safe-area-inset-bottom,0px));}
#session.on,#make.on{display:block;}
/* the arrival and the leave: a short lateral travel with a fade, cheap to paint */
#session.slide-in,#make.slide-in{animation:screenIn .3s cubic-bezier(.25,.9,.3,1);}
#session.slide-out,#make.slide-out{animation:screenOut .22s ease-in forwards;}
@keyframes screenIn{from{transform:translateX(46px);opacity:0;}to{transform:translateX(0);opacity:1;}}
@keyframes screenOut{to{transform:translateX(52px);opacity:0;}}
#make{z-index:120;}
/* Sticky to the top of a container that starts under the status bar, so the day's name was
   sitting behind the notification icons. The bar grows by the inset instead of moving. */
.s-head{position:sticky;top:0;background:rgba(7,8,14,.95);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;z-index:10;display:flex;align-items:center;gap:12px;}
.s-tb{flex:1;min-width:0;}
.s-title{font-family:'Bricolage Grotesque',sans-serif;font-size:17px;font-weight:600;letter-spacing:-.022em;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.s-sub{font-size:12px;color:var(--txt3);margin-top:2px;}
.s-sub b{color:var(--c);font-weight:600;}
/* signature: progress ring */
.ring{position:relative;width:42px;height:42px;flex-shrink:0;}
.ring svg{transform:rotate(-90deg);display:block;}
.ring .trk{stroke:var(--line);}
.ring .bar{stroke:var(--c);stroke-linecap:round;transition:stroke-dashoffset .45s cubic-bezier(.4,0,.2,1);}
.ring .lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;letter-spacing:-.04em;color:var(--txt2);font-family:var(--mono);}
.ring.full .bar{stroke:var(--go);}
.ring.full .lbl{color:var(--go);}
.s-body{max-width:600px;margin:0 auto;padding:16px 16px 0;}
.sect-t{font-family:'Bricolage Grotesque',sans-serif;font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--txt3);padding:20px 2px 9px;}
.sect-t .ss{color:var(--c);}
/* Two supersets back to back read as one four-exercise group unless the pair is drawn as
   a unit, so the members sit inside a tinted, accented enclosure of their own. */
.ssgrp{border:1px solid color-mix(in srgb,var(--c) 40%,var(--line));border-radius:calc(var(--r) + 6px);
  background:color-mix(in srgb,var(--c) 5%,transparent);padding:7px;margin-bottom:9px;}
.ssgrp .exc{margin-bottom:7px;}
.ssgrp .exc:last-child{margin-bottom:0;}
.sslink{width:13px;height:13px;stroke:var(--c);stroke-width:1.7;fill:none;vertical-align:-2px;margin-right:6px;}

.exc{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-bottom:9px;overflow:hidden;transition:border-color .2s;}
.exc.alldone{border-color:color-mix(in srgb,var(--go) 32%,var(--line));}
.ex-h{padding:15px 16px 12px;}
.ex-nrow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.ex-n{font-family:'Bricolage Grotesque',sans-serif;font-size:16px;font-weight:600;letter-spacing:-.02em;color:var(--txt);line-height:1.25;flex:1;}
.ex-tools{display:flex;gap:6px;align-items:center;flex-shrink:0;}
.ex-swap{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--txt3);cursor:pointer;font-size:14px;transition:.15s;}
.ex-swap:hover{color:var(--txt);background:var(--surface2);}
.ex-note{font-size:12.5px;color:var(--txt3);margin-top:5px;line-height:1.5;}
.ex-stats{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;}
.ex-stat{display:flex;align-items:center;gap:5px;color:var(--txt3);}
.ex-stat b{font-family:var(--mono);font-weight:500;font-size:11.5px;letter-spacing:-.01em;}
.st-tgt b{color:var(--txt2);}
.st-last b{color:var(--txt2);}
.st-best b{color:var(--gold);}
.ex-links{margin-top:10px;display:flex;gap:7px;flex-wrap:wrap;}
.ex-links a{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-size:13px;color:var(--txt3);text-decoration:none;padding:8px 11px;border:1px solid var(--line);border-radius:8px;transition:.15s;}
.ex-links a:hover{color:var(--txt);border-color:#33373d;}
.ex-links a.unote-btn{cursor:pointer;}
.ex-links a.unote-btn.has{color:var(--go);border-color:color-mix(in srgb,var(--go) 40%,var(--line));}
/* The ramp, ticked off and thrown away. Deliberately quieter than a real set row: these are
   not your training and must never read as if they were. */
.warm-hd{display:flex;align-items:baseline;gap:8px;margin-top:11px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--txt3);}
.warm-hd span{text-transform:none;letter-spacing:0;color:var(--txt3);}
.warm-row{display:flex;align-items:center;gap:9px;padding:8px 11px;margin-top:6px;border:1px solid var(--line);border-radius:8px;cursor:pointer;transition:.15s;}
.warm-row:hover{border-color:#33373d;}
.warm-row.on{opacity:.45;}
.warm-ck{width:15px;height:15px;flex:none;border:1px solid var(--line);border-radius:5px;position:relative;}
.warm-row.on .warm-ck{background:var(--go);border-color:var(--go);}
.warm-row.on .warm-ck:after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(43deg);}
.warm-row b{font-size:15px;}
.warm-u{font-size:11px;color:var(--txt3);margin-left:-5px;}
.warm-r{font-size:12px;color:var(--txt3);}
.warm-s{margin-left:auto;font-size:11px;color:var(--txt3);text-align:right;}
/* the written instructions sheet: setup line, cues as a list, the one mistake, and the
   external page demoted to a reference footnote where an exact one exists */
.ins-s{font-size:14px;line-height:1.55;color:var(--txt2);margin:4px 0 12px;}
.ins-c{margin:0 0 14px;padding-left:20px;}
.ins-c li{font-size:14px;line-height:1.5;margin:7px 0;color:var(--txt);}
.ins-c li::marker{color:var(--go);}
.ins-m{font-size:13px;line-height:1.5;padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:12px;}
.ins-m span{color:var(--go);font-weight:600;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;}
.ins-m em{font-style:normal;color:var(--txt2);}
.ins-ref{display:inline-block;font-size:12px;color:var(--txt3);text-decoration:none;margin-bottom:4px;}
.ins-ref:hover{color:var(--txt);}
/* Your own note reads as a margin annotation, not as more of the app's voice: indented behind a
   rule, in the accent colour, so it is clearly the thing you wrote. */
.ex-unote{font-size:12.5px;line-height:1.5;margin-top:6px;padding:5px 0 5px 9px;white-space:pre-wrap;
  border-left:2px solid color-mix(in srgb,var(--go) 45%,transparent);color:var(--txt2);}

/* set rows */
.sets{padding:0 10px 10px;}
.srow{display:flex;align-items:center;gap:8px;padding:7px 6px;border-radius:11px;transition:background .18s;}
.srow.done{background:color-mix(in srgb,var(--match) 8%,transparent);}
.srow.ispr{background:color-mix(in srgb,var(--gold) 10%,transparent);}
.srow.isunder{background:color-mix(in srgb,var(--txt3) 14%,transparent);}
.srow.done.isunder .sno{background:color-mix(in srgb,var(--txt3) 26%,transparent);color:var(--txt2);}
.srow.done.isunder .inp{color:var(--txt2);text-shadow:none;}
.srow.done.isunder .chk{background:var(--txt3);border-color:var(--txt3);box-shadow:none;}
.srow.done.isunder .chk svg{stroke:var(--bg);}
.sno{width:22px;height:22px;border-radius:7px;background:var(--surface2);color:var(--txt3);font-family:var(--mono);font-size:12px;font-weight:500;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.srow.done .sno{background:color-mix(in srgb,var(--match) 18%,transparent);color:var(--match);}
.srow.ispr .sno{background:color-mix(in srgb,var(--gold) 20%,transparent);color:var(--gold);}
.inp{background:transparent;border:none;border-bottom:1.5px solid var(--line);color:var(--txt);font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:19px;font-weight:500;padding:5px 2px;border-radius:0;text-align:center;width:64px;letter-spacing:-.02em;}
.inp.wide{width:76px;}
.inp[readonly]{cursor:pointer;}
.inp[readonly]:hover{border-bottom-color:var(--c);}
.srow.done .inp{color:var(--match);border-bottom-color:transparent;}
.srow.ispr .inp{color:var(--gold);border-bottom-color:transparent;}
.mul{font-size:13px;color:var(--txt3);font-family:var(--mono);}
.unit{font-size:12px;color:var(--txt3);}
.chk{position:relative;width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line);background:transparent;cursor:pointer;flex-shrink:0;margin-left:auto;display:flex;align-items:center;justify-content:center;transition:.16s;padding:0;}
.chk svg{width:19px;height:19px;stroke:var(--txt3);stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:.16s;}
/* the theme's own mark stands in for the tick */
.chk svg.glyph{width:22px;height:22px;color:var(--txt3);stroke:currentColor;fill:none;stroke-width:0;}
.chk svg.glyph .f{fill:currentColor;stroke:none;}
.chk:hover svg.glyph{color:var(--txt2);}
.srow.done .chk svg.glyph,.srow.ispr .chk svg.glyph{color:#0b0c0e;}
.srow.done.isunder .chk svg.glyph{color:var(--bg);}
.chk:hover{border-color:#3d434a;}
.chk:hover svg{stroke:var(--txt2);}
.srow.done .chk{background:var(--match);border-color:var(--match);}
.srow.done .chk svg{stroke:#0b0c0e;stroke-width:3;}
.srow.ispr .chk{background:var(--gold);border-color:var(--gold);}
.srow.ispr .chk svg{stroke:#0b0c0e;stroke-width:3;}
.hold{width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--txt3);font-size:12px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:.16s;}
.hold:hover{color:var(--txt);border-color:#3d434a;}
.hold.running{background:var(--gold);border-color:var(--gold);color:#0b0c0e;}
.hold.resume{border-color:var(--gold);color:var(--gold);}
.ex-foot{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:2px 16px 13px;}
.ex-foot .ex-rest{padding:0;}
.ex-pr{font-size:12px;letter-spacing:.08em;color:var(--txt3);white-space:nowrap;flex:0 0 auto;}
.ex-pr b{font-weight:600;color:color-mix(in srgb,var(--gold) 72%,var(--txt3));letter-spacing:0;font-size:12.5px;}
.ex-rest{font-size:11.5px;color:var(--txt3);padding:2px 16px 13px;}

.notebox{margin:24px 0 0;}
.notebox textarea{width:100%;min-height:86px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);color:var(--txt);font-size:14px;padding:14px;resize:vertical;line-height:1.55;}
.notebox textarea:focus{outline:none;border-color:#33373d;}
.finish-inline{margin:22px 0 12px;}
.finishbtn{display:block;width:100%;padding:17px;border-radius:var(--r);border:none;background:var(--go);color:#08130d;font-family:'Bricolage Grotesque',sans-serif;font-size:15px;font-weight:700;letter-spacing:-.01em;cursor:pointer;transition:.15s;}
.finishbtn:hover{filter:brightness(1.08);}
.btn{font-size:12.5px;font-weight:500;cursor:pointer;padding:9px 13px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--txt2);flex-shrink:0;transition:.15s;}
.btn:hover{color:var(--txt);border-color:#33373d;}
.btn-c{border-color:color-mix(in srgb,var(--c) 45%,var(--line));color:var(--c);}
.btn-go{border-color:var(--go);color:var(--go);}
.btn-prime{background:var(--go);border-color:var(--go);color:#0b0c0e;font-weight:700;letter-spacing:.07em;}
.btn-prime:hover{color:#0b0c0e;border-color:var(--go);filter:brightness(1.08);}
.btn-bad{--bad:#e0736b;color:var(--bad);border-color:color-mix(in srgb,var(--bad) 42%,var(--line));}
.btn-bad:hover{color:var(--bad);background:color-mix(in srgb,var(--bad) 11%,var(--surface));
  border-color:color-mix(in srgb,var(--bad) 72%,var(--line));}
/* A touch screen has no pointer to hover with, but it applies :hover to whatever you last
   touched and keeps it. After a long press the sheet opens under your finger and its first
   button comes up already lit. */
@media(hover:none){
  .btn:hover{color:var(--txt2);border-color:var(--line);}
  .btn-go:hover{color:var(--go);border-color:var(--go);}
  .btn-c:hover{color:var(--c);}
  .btn-bad:hover{background:var(--surface);border-color:color-mix(in srgb,var(--bad) 42%,var(--line));}
  .slotrow:hover,.thcard:hover{border-color:var(--line);}
  .thcard.sel:hover{border-color:var(--gold);}
  .mk-new:hover{background:color-mix(in srgb,var(--go) 4%,transparent);
    border-color:color-mix(in srgb,var(--go) 40%,var(--line));}
  .side:hover{border-color:var(--line);background:var(--surface);}
  .swapitem:hover{border-color:var(--line);background:transparent;}
}
/* and the release that ended the long press must not land on a button that was not there
   when the finger went down */
.ovl.fresh .sheet-btns,.ovl.fresh .mk-acts{pointer-events:none;}

/* Cardio and the pump day are not week slots, so they sit under the board rather than in
   it - two plain doors below the builder. They used to be 46px pebbles pinned to the bottom
   corners, which put the two things you do most often behind the least legible control on
   the screen. Cardio leads: it happens every day, the pump day almost never. */
.sides{display:flex;flex-direction:column;gap:7px;margin-top:8px;}
.side{display:flex;align-items:center;gap:11px;padding:13px 14px;border:1px solid var(--line);
  border-radius:var(--r);background:var(--surface);cursor:pointer;transition:.15s;position:relative;}
.side:hover{border-color:color-mix(in srgb,var(--gold) 45%,var(--line));background:var(--surface2);}
.side:active{transform:scale(.995);}
.side-i{display:flex;color:var(--txt2);flex-shrink:0;}
.side-i svg{width:19px;height:19px;display:block;}
.side b{font-size:13.5px;font-weight:600;color:var(--txt);letter-spacing:.01em;}
.side small{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--txt3);letter-spacing:.03em;white-space:nowrap;}
.side.going{border-color:color-mix(in srgb,var(--go) 55%,var(--line));}
.side.going .side-i,.side.going small{color:var(--go);}
/* same shape as .lvl above - a walk in progress is on screen for as long as the walk lasts,
   which is exactly the case where a per-frame repaint is least affordable */
.side.going::after{content:'';position:absolute;inset:-1px;border-radius:var(--r);pointer-events:none;
  box-shadow:0 0 14px 1px color-mix(in srgb,var(--go) 32%,transparent);
  opacity:0;will-change:opacity;animation:walkgo 2.6s ease-in-out infinite;}
@keyframes walkgo{0%,100%{opacity:0;}50%{opacity:1;}}
body.light .side{box-shadow:0 1px 3px rgba(16,20,24,.08);}
/* The launch animation used to hand straight over to a fully drawn board. The board now
   arrives just behind it: the header first, then each card a beat after the one above it. */
body.held #home > *,body.held #weekCards > *{opacity:0;}
body.arriving #home > *{opacity:0;animation:arrive .5s cubic-bezier(.32,.9,.36,1) forwards;}
body.arriving .brand{animation-delay:.02s;}
body.arriving .sec-label,body.arriving .mk-hint{animation-delay:.10s;}
body.arriving #weekCards{opacity:1;animation:none;}
body.arriving #weekCards > *{opacity:0;animation:arrive .46s cubic-bezier(.32,.9,.36,1) forwards;}
body.arriving #weekCards > *:nth-child(1){animation-delay:.14s;}
body.arriving #weekCards > *:nth-child(2){animation-delay:.20s;}
body.arriving #weekCards > *:nth-child(3){animation-delay:.26s;}
body.arriving #weekCards > *:nth-child(4){animation-delay:.32s;}
body.arriving #weekCards > *:nth-child(5){animation-delay:.38s;}
body.arriving #weekCards > *:nth-child(6){animation-delay:.44s;}
body.arriving #weekCards > *:nth-child(7){animation-delay:.50s;}
body.arriving #weekCards > *:nth-child(n+8){animation-delay:.56s;}
body.arriving .mk-new{animation-delay:.62s;}
body.arriving .sides{animation-delay:.66s;}
body.arriving .foot{animation-delay:.72s;}
@keyframes arrive{from{opacity:0;transform:translateY(9px);}to{opacity:1;transform:none;}}
@media(prefers-reduced-motion:reduce){
  body.arriving #home > *,body.arriving #weekCards > *{animation-duration:.01s;}}

/* Four worlds is too many to tell apart by name alone, so each one says what it is. */
.thcard{display:flex;align-items:flex-start;gap:12px;padding:14px;border:1px solid var(--line);
  border-radius:12px;background:var(--surface2);cursor:pointer;transition:.15s;position:relative;}
.thcard:hover{border-color:color-mix(in srgb,var(--gold) 45%,var(--line));}
.thcard.sel{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 7%,var(--surface2));}
.th-ic{width:22px;height:22px;flex-shrink:0;color:var(--txt2);margin-top:1px;}
.thcard.sel .th-ic{color:var(--gold);}
.th-ic svg{width:22px!important;height:22px!important;}
.th-b{min-width:0;flex:1;}
.th-b b{display:block;font-size:14.5px;font-weight:600;color:var(--txt);letter-spacing:.01em;}
.th-b small{display:block;font-size:11.5px;color:var(--txt3);line-height:1.5;margin-top:3px;text-wrap:pretty;}
.th-cur{position:absolute;top:12px;right:12px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--gold);}
.wk-clock{font-family:var(--mono);font-size:52px;font-weight:500;letter-spacing:-.03em;color:var(--txt);
  text-align:center;line-height:1;margin:6px 0 4px;font-variant-numeric:tabular-nums;}
.wk-clock.going{color:var(--go);}
.wk-hint{text-align:center;font-size:11.5px;color:var(--txt3);margin-bottom:16px;}
.wk-stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:12px;overflow:hidden;margin-bottom:16px;}
.wk-s{background:var(--surface2);padding:12px 13px;}
.wk-s b{display:block;font-family:var(--mono);font-size:21px;font-weight:500;color:var(--txt);line-height:1.1;}
.wk-s b small{font-size:11px;color:var(--txt3);margin-left:3px;}
.wk-s span{display:block;font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--txt3);margin-top:5px;}
.wk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:4px;}
.wk-f{display:flex;flex-direction:column;gap:5px;}
.wk-f span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--txt3);}
.wk-in{width:100%;box-sizing:border-box;padding:11px 8px;text-align:center;border-radius:9px;border:1px solid var(--line);
  background:var(--surface2);color:var(--txt);font-family:var(--mono);font-size:16px;}
.wk-in:focus{outline:none;border-color:var(--go);}
.wk-feel{display:flex;gap:7px;margin:12px 0 4px;}
.wk-feel div{flex:1;text-align:center;padding:10px 4px;border-radius:9px;border:1px solid var(--line);
  background:var(--surface2);color:var(--txt3);font-size:12px;cursor:pointer;transition:.15s;}
.wk-feel div.sel{border-color:var(--go);color:var(--go);background:color-mix(in srgb,var(--go) 10%,var(--surface2));}
.wk-pace{text-align:center;font-size:11.5px;color:var(--txt3);font-family:var(--mono);margin-top:12px;min-height:15px;}

/* timer */
/* Sat under the navigation bar in the app build - the timer was there, just unreadable. */
.timer-pill{display:none;align-items:center;gap:9px;position:fixed;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--line);color:var(--txt);padding:9px 11px 9px 13px;border-radius:16px;z-index:120;box-shadow:0 10px 34px rgba(0,0,0,.55);white-space:nowrap;}
.timer-pill.on{display:flex;}
.ttime{font-family:var(--mono);font-size:20px;font-weight:500;min-width:58px;text-align:center;letter-spacing:-.03em;}
.tbtn{font-size:13px;font-weight:500;padding:10px 11px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--txt2);cursor:pointer;}
.tbtn:hover{color:var(--txt);}
.timer-pill.ring2{background:var(--go);border-color:var(--go);color:#08130d;}
.timer-pill.ring2 .tbtn{background:rgba(0,0,0,.12);border-color:rgba(0,0,0,.16);color:#08130d;}
#flame{display:block;width:32px;height:52px;margin:-14px 0 -6px;flex-shrink:0;}

/* ---------- page turn ---------- */
#turn{display:none;position:fixed;inset:0;z-index:190;perspective:1500px;perspective-origin:0% 50%;pointer-events:none;}
#turn.on{display:block;}
#turn .tpage{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;background:linear-gradient(102deg,var(--surface2) 0%,var(--surface) 46%,var(--bg) 100%);box-shadow:26px 0 70px rgba(0,0,0,.62);animation:pturn 1.05s cubic-bezier(.42,.03,.28,1) forwards;}
#turn .tpage::before{content:'';position:absolute;inset:0;background:linear-gradient(100deg,rgba(198,224,255,.11) 0%,rgba(198,224,255,.02) 30%,transparent 62%);pointer-events:none;}
#turn .tpage::after{content:'';position:absolute;top:0;bottom:0;right:0;width:2px;background:linear-gradient(180deg,transparent,var(--go),transparent);opacity:.5;}
#turn.back .tpage{animation:pturnb .58s cubic-bezier(.36,.02,.24,1) forwards;}
#turn.back .tspine{animation:sfade .58s ease forwards;}
#turn .tspine{position:absolute;top:0;bottom:0;left:0;width:46px;background:linear-gradient(90deg,rgba(0,0,0,.8),transparent);animation:sfade 1.05s ease forwards;}
@keyframes pturn{from{transform:rotateY(0);}to{transform:rotateY(-122deg);}}
@keyframes pturnb{from{transform:rotateY(-122deg);}to{transform:rotateY(0);}}
@keyframes sfade{from{opacity:0;}40%{opacity:1;}to{opacity:0;}}
/* Forge does not turn pages. A plate is drawn across the opening instead - flat, no
   perspective, with the leading edge still carrying heat from the fire. */
body.forge #turn{perspective:none;}
body.forge #turn .tpage{transform-origin:center;transform-style:flat;box-shadow:none;
  background:linear-gradient(100deg,#1c0f08 0%,#120806 52%,#080403 100%);
  animation:plate .60s cubic-bezier(.32,0,.16,1) forwards;}
body.forge #turn .tpage::before{background:linear-gradient(100deg,rgba(255,196,140,.07),rgba(255,196,140,.015) 32%,transparent 60%);}
body.forge #turn .tpage::after{width:3px;opacity:.85;
  background:linear-gradient(180deg,transparent,#ff9a34 18%,#ffe0b0 50%,#ff9a34 82%,transparent);
  box-shadow:0 0 14px rgba(255,138,31,.75);}
body.forge #turn.back .tpage{animation:plateb .60s cubic-bezier(.32,0,.16,1) forwards;}
body.forge #turn .tspine{display:none;}
@keyframes plate{from{transform:translateX(0);}to{transform:translateX(-104%);}}
@keyframes plateb{from{transform:translateX(-104%);}to{transform:translateX(0);}}
body.light #turn .tpage{box-shadow:26px 0 60px rgba(16,20,24,.3);}
body.light #turn .tspine{background:linear-gradient(90deg,rgba(16,20,24,.3),transparent);}

/* ---------- session summary ---------- */
.sum{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:16px;}
.sum-c{background:var(--surface2);padding:14px 15px;}
.sum-n{font-family:var(--mono);font-size:25px;font-weight:500;letter-spacing:-.03em;color:var(--txt);line-height:1.1;}
.sum-n small{font-size:12px;color:var(--txt3);letter-spacing:0;margin-left:3px;}
.sum-l{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--txt3);margin-top:6px;}
.sum-c.pr .sum-n{color:var(--gold);}
.sum-c.pr .sum-l{color:var(--gold);opacity:.75;}

/* sheets */
/* The padding was a flat 26px top and bottom, which was right in a browser tab and wrong in the
   app: the WebView draws edge to edge, so the bottom of the sheet - the CLOSE button, usually -
   sat underneath Android's gesture bar with no way to reach it. The insets are what the system
   bars actually measure, so the sheet ends above them instead of behind them. */
.ovl{display:none;position:fixed;inset:0;background:rgba(6,7,9,.72);backdrop-filter:blur(3px);z-index:200;
  padding:calc(26px + env(safe-area-inset-top,0px)) 16px calc(30px + env(safe-area-inset-bottom,0px));
  overflow-y:auto;overscroll-behavior:contain;}
.ovl.on{display:block;}
/* The ground is behind the scrim and cannot be read through it, so while a sheet is open it
   is taken out of the picture entirely. visibility, not opacity - a hidden layer is not
   rastered at all, and on a folded-open panel that is the largest single thing Chrome was
   being asked to keep painting behind a menu it could already not finish. */
/* But hiding it is not free, and the bill arrives on the way OUT. .ovl closes on display,
   not on a transition, so the sheet vanishes and the whole ground - rules, watermark, wind,
   rings, forty odd embers, grain, vignette - has to be rastered from nothing in that same
   single frame. Measured on the phone, every sheet in the app: settings 58ms, backup 42ms,
   timer 50ms, pump 58ms, walk 67ms, a workout day 50ms. Every one of them opened without
   dropping a frame and cost one long frame to close. An A/B on the device with the ground
   left visible put the same closes at 25ms.
   The saving was always about the folded-open panel, where the ground is four times the area
   and Chrome was already failing to finish it - that is what the comment above describes and
   it is still true there. On a phone-sized screen it was buying nothing and charging a
   dropped frame every time you backed out of anything, so it is scoped to the panel that
   needed it. The freeze below stays everywhere: pausing costs nothing to undo. */
@media(min-width:600px){
  body:has(.ovl.on) #bg,body:has(.ovl.on) #home::before{visibility:hidden;}
}
/* and nothing under it needs to keep moving - the ground is behind a scrim, so freezing it
   while a sheet is open costs nothing visible and stops the invalidations underneath */
body:has(.ovl.on) .bg-light,body:has(.ovl.on) .bg-motes i,body:has(.ovl.on) .bg-ripple i,
body:has(.ovl.on) .bg-rules,body:has(.ovl.on) .bg-rules > i,body:has(.ovl.on) .bg-wm svg,
body:has(.ovl.on) .card-day::after,body:has(.ovl.on) .dayglow::before,body:has(.ovl.on) .dayglow::after{animation-play-state:paused;}
/* A day and the builder are full-screen and painted on an opaque var(--bg), exactly like a
   sheet - but they are not .ovl, so none of the above ever applied to them and the entire
   ground went on painting and animating at full size behind a screen that completely covers
   it. On a phone that is only waste. On a folded-open panel it is waste competing for the
   raster at the one moment the day is trying to arrive, which is why a day came in two
   pieces: the top band first, the rest a moment behind it. Same treatment as a sheet. */
/* Same bill on the way out of a day, and the same scope - see the note on the sheet rule. */
@media(min-width:600px){
  body:has(#session.on) #bg,body:has(#make.on) #bg,
  body:has(#session.on) #home::before,body:has(#make.on) #home::before{visibility:hidden;}
}
body:has(#session.on) .bg-light,body:has(#session.on) .bg-motes i,body:has(#session.on) .bg-ripple i,
body:has(#session.on) .bg-rules,body:has(#session.on) .bg-rules > i,body:has(#session.on) .bg-wm svg,
body:has(#session.on) .card-day::after,body:has(#session.on) .dayglow::before,body:has(#session.on) .dayglow::after,
body:has(#make.on) .bg-light,body:has(#make.on) .bg-motes i,body:has(#make.on) .bg-ripple i,
body:has(#make.on) .bg-rules,body:has(#make.on) .bg-rules > i,body:has(#make.on) .bg-wm svg,
body:has(#make.on) .card-day::after,body:has(#make.on) .dayglow::before,body:has(#make.on) .dayglow::after{animation-play-state:paused;}
/* The tour is a scrim over the whole screen, so it gets the same treatment as an open
   sheet: the ground behind it is not visible and does not need to keep moving. */
body.tut .bg-light,body.tut .bg-motes i,body.tut .bg-ripple i,
body.tut .bg-rules,body.tut .bg-rules > i,body.tut .bg-wm svg{animation-play-state:paused;}
/* A confirm has to clear any sheet that is already open. Every .ovl shares z-index 200,
   so #askOvl lost on DOM order - which is what hid the blocked-notifications message
   behind the timer sheet, leaving only a dimmed window. */
#askOvl{z-index:320;}   /* above the 300-level sheets, so Keep the change? lands on top of them */
.sheet{max-width:520px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;}
.sheet h3{font-family:'Bricolage Grotesque',sans-serif;font-size:18px;font-weight:600;letter-spacing:-.02em;color:var(--txt);margin-bottom:5px;}
.sheet p{font-size:13px;color:var(--txt3);margin-bottom:16px;line-height:1.55;}
.sheet textarea{width:100%;min-height:230px;background:var(--bg);border:1px solid var(--line);border-radius:11px;color:var(--txt2);font-family:var(--mono);font-size:12px;padding:13px;line-height:1.65;resize:vertical;}
.sheet-btns{display:flex;gap:8px;margin-top:16px;}
/* Centred both ways. The row stretches every button to match the tallest, so as soon as one of
   them wrapped to two lines - JUST TODAY, ADD PERMANENTLY - the single-line CANCEL beside it kept its
   text up at the top of a box that had grown underneath it. */
.sheet-btns .btn{flex:1;text-align:center;padding:13px;display:flex;align-items:center;justify-content:center;}
.swaplist{max-height:calc(var(--usablevh) * .58);overflow-y:auto;}
.swaphead{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--go);margin:16px 0 8px;}
.swapitem{padding:13px 14px;border:1px solid var(--line);border-radius:11px;margin-bottom:7px;font-size:14px;color:var(--txt);cursor:pointer;transition:.15s;}
.swapitem:hover{border-color:#3d434a;background:var(--surface2);}
.swapitem small{display:block;color:var(--txt3);font-family:var(--mono);font-size:11px;margin-top:4px;}

/* ---------- the builder ---------- */
.mk-hint{font-size:11px;color:var(--txt3);margin:-6px 0 12px;letter-spacing:.02em;}
.mk-lbl{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--txt3);margin:24px 0 9px;}
/* The day's own three controls. Small and side by side rather than three full-width buttons:
   they are the shape of a toolbar, not of a decision you make one at a time. Delete is the trash
   alone, because a bin needs no label and a destructive control reads better without shouting. */
/* the run list in the hold sheet: the superset drawn as its members, not described in prose */
.exed-run-h{display:flex;align-items:center;justify-content:space-between;margin:14px 0 2px;}
.exed-run-h span:first-child{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--go);}
.exed-run-row{display:flex;align-items:center;gap:7px;padding:7px 0;border-top:1px solid color-mix(in srgb,var(--line) 60%,transparent);}
.exed-run-row:first-of-type{border-top:none;}
.exed-run-row.me .exed-run-name{color:var(--go);}
.exed-run-n{font-family:var(--mono);font-size:10px;color:var(--txt3);width:14px;text-align:right;flex-shrink:0;}
.exed-run-name{flex:1;font-size:13px;color:var(--txt);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.exed-run-row .mk-ic{width:34px;height:34px;flex-shrink:0;}
.exed-run-row .exed-out{flex-shrink:0;}
.mk-ic:disabled{opacity:.28;cursor:default;}
.exed-q{font-size:12px;color:var(--txt3);text-align:right;margin:12px 2px -4px;}
.exed-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:5px;}
.exed-h .dayact.del{margin-left:0;flex:0 0 auto;}
.dayact.exed-off{opacity:.4;cursor:default;}
.dayacts{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap;}
.dayact{display:inline-flex;align-items:center;gap:7px;padding:9px 12px;border-radius:10px;cursor:pointer;
  border:1px solid var(--line);background:var(--surface);color:var(--txt3);
  font-family:inherit;font-size:12px;letter-spacing:.02em;transition:.15s;}
.dayact svg{width:15px;height:15px;flex:0 0 15px;fill:none;stroke:currentColor;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round;}
.dayact:hover{color:var(--txt);border-color:#3d434a;}
.dayact.on{color:var(--go);border-color:color-mix(in srgb,var(--go) 45%,var(--line));
  background:color-mix(in srgb,var(--go) 10%,var(--surface));}
.dayact.del{--bad:#e0736b;color:var(--bad);border-color:color-mix(in srgb,var(--bad) 34%,var(--line));
  padding:9px 11px;margin-left:auto;}
.dayact.del:hover{background:color-mix(in srgb,var(--bad) 12%,var(--surface));
  border-color:color-mix(in srgb,var(--bad) 65%,var(--line));}
body.forge .dayact.del{--bad:#f0645a;}
body.light .dayact.del{--bad:#b1332c;}
.mk-in{width:100%;box-sizing:border-box;padding:13px 14px;border-radius:11px;border:1px solid var(--line);background:var(--surface2);color:var(--txt);font-family:inherit;font-size:15px;}
.mk-in::placeholder{color:var(--txt3);}
.mk-in:focus{outline:none;border-color:color-mix(in srgb,var(--go) 55%,var(--line));}
.mk-slots{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
.mk-slot{padding:10px 5px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);cursor:pointer;text-align:center;transition:.15s;overflow:hidden;}
.mk-slot b{display:block;font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--txt2);font-weight:400;}
.mk-slot small{display:block;font-size:11px;color:var(--txt3);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mk-slot.sel{border-color:var(--mkc);background:color-mix(in srgb,var(--mkc) 13%,var(--surface2));}
.mk-slot.sel b{color:var(--mkc);}
.mk-cols{display:flex;gap:9px;flex-wrap:wrap;}
.mk-col{width:30px;height:30px;border-radius:9px;border:1px solid rgba(255,255,255,.14);cursor:pointer;transition:.15s;}
.mk-col.sel{outline:2px solid var(--txt);outline-offset:2px;}
.mk-blk{border:1px solid var(--line);border-radius:13px;background:var(--surface);padding:12px 12px 4px;margin-bottom:11px;}
.mk-bh{display:flex;gap:8px;align-items:center;}
.mk-bt{flex:1;min-width:0;padding:9px 11px;font-size:13px;border-radius:9px;}
/* What the block is, stated rather than asked for - it took the name box's place in the row */
/* A run of exercises, drawn as one bracketed group rather than as a box you had to make first.
   The rows keep their own shape inside it - it is a relationship, not a container. */
