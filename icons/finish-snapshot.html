   filter is one of the two causes named at the top of the ground rules; it survived here
   because a 36px logo looks too small to matter, and per-frame cost does not care how big
   the element is.
   Same fix as the runes: the lit copy is a second glyph stacked exactly over the first,
   carrying the bright shadow as a STATIC filter, and only its opacity breathes. Both copies
   draw the same fully opaque ink in the same place, so the overlap is invisible and all that
   reads is the glow coming up and going down. One composited property, nothing repaints. */
.markwrap{position:relative;flex-shrink:0;display:block;line-height:0;}
.mark{filter:drop-shadow(0 0 3px color-mix(in srgb,var(--gold) 18%,transparent));}
.markglow{position:absolute;left:0;top:0;pointer-events:none;opacity:0;will-change:opacity;
  filter:drop-shadow(0 0 7px color-mix(in srgb,var(--gold) 85%,transparent)) drop-shadow(0 0 20px color-mix(in srgb,var(--gold) 40%,transparent));
  animation:markbreath 6.4s ease-in-out infinite;}
@keyframes markbreath{0%,100%{opacity:0;}50%{opacity:1;}}
body.forge .markglow{animation-duration:4.4s;}
body.moon .markglow{animation-duration:9s;}
body.light .markglow,body.booting .markglow{animation:none;opacity:0;}
/* Reduced motion still gets a lit rune - just a slower, shallower breath. Killing it
   outright was hiding the effect entirely on phones with battery saver on. */
@media (prefers-reduced-motion:reduce){.card-day::after{animation-duration:11s;}.srow.ispr .inp{animation-duration:7s;}}
.card:hover{box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 22%,transparent),0 16px 40px -22px color-mix(in srgb,var(--c) 60%,transparent);}
.ring .bar{filter:drop-shadow(0 0 5px color-mix(in srgb,var(--c) 65%,transparent));}
.ring.full .bar{filter:drop-shadow(0 0 6px color-mix(in srgb,var(--go) 75%,transparent));}
.srow.done .inp{text-shadow:0 0 16px color-mix(in srgb,var(--go) 42%,transparent);}
.srow.ispr .inp{text-shadow:0 0 18px color-mix(in srgb,var(--gold) 48%,transparent);}
.srow.done .chk{box-shadow:0 0 16px -3px color-mix(in srgb,var(--match) 70%,transparent);}
.srow.ispr .chk{box-shadow:0 0 18px -3px color-mix(in srgb,var(--gold) 75%,transparent);}
.st-best b{text-shadow:0 0 14px color-mix(in srgb,var(--gold) 40%,transparent);}
.finishbtn{box-shadow:0 0 34px -10px color-mix(in srgb,var(--go) 80%,transparent);}
body.light .card-day,body.light .srow.done .inp,body.light .srow.ispr .inp,body.light .st-best b{text-shadow:none;}
body.light .srow.done .chk,body.light .srow.ispr .chk,body.light .finishbtn{box-shadow:none;}
.card::before{display:none;}
.card{border-radius:13px;}
.pill{border-radius:6px;font-family:var(--mono);font-weight:400;letter-spacing:.07em;text-transform:uppercase;}
.iconbtn{border-radius:10px;}
.iconbtn svg,.ex-swap svg,.hold svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
.hold svg{width:15px;height:15px;}
.ex-links a svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.7;}
.ex-links a{border-radius:8px;}
.chk,.hold{border-radius:11px;}
.srow{border-radius:10px;}
.mark{flex-shrink:0;}
/* logging a set lights it */
.chk.flare{animation:chkpop .44s cubic-bezier(.34,1.45,.6,1);}
.chk.flare::before{content:'';position:absolute;inset:-9px;border-radius:18px;pointer-events:none;
  background:radial-gradient(closest-side,rgba(255,196,110,.9),rgba(255,124,44,.42) 44%,transparent 72%);
  animation:emberout .66s ease-out forwards;}
.chk.flare.pr::before{background:radial-gradient(closest-side,rgba(255,232,160,.95),rgba(240,201,107,.5) 44%,transparent 72%);}
@keyframes chkpop{0%{transform:scale(1);}36%{transform:scale(1.2);}100%{transform:scale(1);}}
@keyframes emberout{0%{opacity:0;transform:scale(.45);}20%{opacity:1;transform:scale(1);}100%{opacity:0;transform:scale(1.55);}}

/* ---------- a finished day is sealed shut ---------- */
.card.sealed{border-color:#2c3444;background:linear-gradient(180deg,#0d1017,#090b11);}
.card.sealed .card-name{color:var(--txt2);}
.card.sealed .card-day{color:var(--txt2);text-shadow:none;}
.card.sealed .card-meta{color:var(--txt2);}
.card.sealed::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(135deg,rgba(150,164,192,.055) 0 2px,transparent 2px 6px),
             linear-gradient(180deg,transparent 55%,rgba(0,0,0,.45));}
.card.sealed:hover{box-shadow:none;border-color:#3a4457;}
.seal{position:absolute;right:12px;bottom:10px;width:20px;height:20px;opacity:.3;pointer-events:none;}
/* ---- THE QUENCH (Forge) ----
   A finished day is a finished PIECE: pulled from the fire and cooled. Neutral ash - no
   hue at all, chosen over warm ash and gunmetal on the panel - because next to a warm
   world, hue-absence itself reads as cold. Deliberately OPAQUE where every live card is
   translucent: the ground's firelight must not re-warm the metal, and the solidity is the
   point - live days are still part of the fire, a finished one is settled matter. The
   sheen band and the lighter top edge are the light on a polished face; both are static
   paint, costing nothing per frame. The gold COMPLETED pill stays exactly as it was: a
   maker's stamp wants metal under it. The old gold ouroboros seal is hidden here - the
   first world's serpent has no business signing the third world's work. */
body.forge .card.sealed{
  background:
    linear-gradient(115deg,rgba(255,255,255,0) 38%,rgba(255,255,255,.05) 46%,rgba(255,255,255,0) 55%),
    #171716;
  border-color:#343433;border-top-color:#454543;}
body.forge .card.sealed .card-name{color:#a8a6a2;}
body.forge .card.sealed .card-meta{color:#727170;}
body.forge .card.sealed .carddrag{color:#5c5b59;}
body.forge .card.sealed .seal{display:none;}
body.forge .daybox.quenched{border-color:#2c2c2b;background:rgba(23,23,22,.42);}
body.forge .daybox.quenched .dayhead{color:#84827f;}
body.forge .daybox.quenched .dayglow{display:none;}
body.forge .daybox.today.quenched{border-color:#3a3a38;}
/* ---- The board, v5.137: the rail and the plates (owner picked B + C, 14 Sep). ----
   No trays. One ember spine runs down the left of the week and every day is a stop on it;
   today's stop is lit. Each workout is a forged plate: bevelled, a lit top edge, a soft drop,
   and the ember rail along its left edge. Empty days keep the dashed way in. */
body.forge #weekCards{position:relative;padding-left:16px;}
body.forge #weekCards::before{content:'';position:absolute;left:3px;top:10px;bottom:14px;width:2px;border-radius:2px;
  background:linear-gradient(180deg,#6a3f26,#3a2214 55%,#2a1810);}
body.forge .daybox{border:0;border-radius:0;background:transparent;padding:0 0 13px;margin:0;position:relative;box-shadow:none;}
body.forge .daybox::before{content:'';position:absolute;left:-17.5px;top:4px;width:9px;height:9px;border-radius:50%;
  background:#3a2214;border:2px solid var(--bg);box-shadow:0 0 0 1px #5a3520;}
body.forge .daybox.empty{padding-bottom:13px;}
body.forge .daybox.empty::before{background:#2a1810;box-shadow:0 0 0 1px #3a2214;}
body.forge .daybox.empty .dayhead{color:var(--txt3);}
body.forge .daybox.today{border:0;box-shadow:none;}
body.forge .daybox.today::before{background:var(--gold);box-shadow:0 0 0 1px #a0521c,0 0 12px rgba(255,138,31,.75);}
body.forge .daybox.today > .dayglow{display:none;}
body.forge .daybox.quenched{border:0;background:transparent;}
body.forge .daybox.quenched::before{background:#2c2c2b;box-shadow:0 0 0 1px #3a3a38;}
body.forge .daybox.dropok{background:color-mix(in srgb,var(--go) 9%,transparent);border-radius:12px;}
body.forge .daybox.dropfull{background:color-mix(in srgb,#c2554a 10%,transparent);border-radius:12px;}
/* Day names read against the glowing ground (v5.139): the brighter brown, a touch larger, and a
   hair of shadow so the ember behind them never washes them out. Empty days one step quieter. */
body.forge .dayhead{padding:0 2px 7px;color:var(--txt2);font-size:11.5px;text-shadow:0 1px 2px rgba(0,0,0,.7);}
body.forge .card{border-radius:12px;padding:10px 12px 10px 16px;overflow:hidden;
  background:linear-gradient(180deg,#2c1a12,#1d110b);border:1px solid #5a3520;border-top-color:#7a4c30;
  box-shadow:inset 0 1px 0 rgba(255,215,170,.14),inset 0 -1px 0 rgba(0,0,0,.5),0 7px 18px -9px rgba(0,0,0,.85);}
body.forge .card::before{display:block;width:4px;background:linear-gradient(180deg,#ffb35c,#d97b2e 60%,#7a3a12);}
body.forge .card:hover{background:linear-gradient(180deg,#332016,#22140d);border-color:#7a4c30;}
body.forge .daybox.today .card{border-color:#a0521c;border-top-color:#c06a30;
  box-shadow:inset 0 1px 0 rgba(255,215,170,.18),inset 0 -1px 0 rgba(0,0,0,.5),0 0 18px -4px rgba(255,120,30,.35),0 7px 18px -9px rgba(0,0,0,.85);}
body.forge .card.sealed::before{background:linear-gradient(180deg,#5a5855,#3a3836);}
body.forge .card.opt::before{background:repeating-linear-gradient(180deg,#d97b2e 0 6px,transparent 6px 11px);}
body.forge .dayempty.dayadd{border-color:#3a2214;}
body.forge .dayempty.dayadd.quiet{color:#8a6a52;}

/* ---- The board, v5.140: blackened steel (owner picked G, 14 Sep). ----
   The day name is stamped as a tab on the plate's shoulder with its own stop, so label and plate
   are one object. Plates are the darkest iron, opaque, with a hot ember rail. Today's tab turns
   to embers. Empty days are slots cut into the ground. The v5.137 spine and stops are retired. */
body.forge #weekCards{padding-left:0;}
body.forge #weekCards::before{display:none;}
body.forge .daybox::before{display:none;}
body.forge .daybox{padding:0 0 14px;}
body.forge .dayhead{display:flex;align-items:flex-end;justify-content:space-between;padding:0;margin:0;text-shadow:none;}
body.forge .dayhead > span:first-child{display:inline-flex;align-items:center;gap:8px;
  font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--txt2);
  background:#1a100b;border:1px solid #4a2c1c;border-bottom:0;border-radius:8px 8px 0 0;padding:7px 11px 6px;margin-left:9px;position:relative;top:1px;}
body.forge .dayhead > span:first-child::before{content:'';width:7px;height:7px;border-radius:50%;background:#4a2c1c;flex-shrink:0;}
body.forge .dayhead-add{padding:0 6px 6px;color:var(--txt3);}
body.forge .daybox.today .dayhead > span:first-child{color:#ffd9b5;background:#3a1d0c;border-color:#a0521c;}
body.forge .daybox.today .dayhead > span:first-child::before{background:var(--gold);box-shadow:0 0 10px rgba(255,138,31,.9);}
body.forge .daybox.empty .dayhead > span:first-child{color:var(--txt3);background:#120b08;border-color:#2e1a10;}
body.forge .daybox.quenched .dayhead > span:first-child{color:#84827f;background:#171716;border-color:#343433;}
body.forge .daybox.quenched .dayhead > span:first-child::before{background:#3a3a38;}
body.forge .card{border-radius:10px;padding:12px 12px 12px 18px;margin-bottom:8px;
  background:#130c09;border:1px solid #4a2c1c;border-top-color:#6a3f26;
  box-shadow:inset 0 1px 0 rgba(255,215,170,.12),inset 0 0 0 1px rgba(0,0,0,.4),0 10px 22px -10px rgba(0,0,0,.95);}
body.forge .card::before{display:block;width:6px;background:linear-gradient(180deg,#ffb35c,#ff7a1a 50%,#8a3f10);box-shadow:0 0 12px rgba(255,120,30,.5);}
body.forge .card:hover{background:#1a110c;border-color:#6a3f26;}
body.forge .daybox.today .card{border-color:#a0521c;border-top-color:#c06a30;
  box-shadow:inset 0 1px 0 rgba(255,215,170,.18),0 0 24px -6px rgba(255,120,30,.55),0 10px 22px -10px rgba(0,0,0,.95);}
body.forge .card .card-name{font-size:17px;}
body.forge .card .card-meta{color:var(--txt2);}
body.forge .dayempty.dayadd,body.forge .dayempty.dayadd.quiet{border:1px solid #2a1810;border-radius:10px;background:#0e0805;
  box-shadow:inset 0 2px 6px rgba(0,0,0,.9);color:#7a5a44;padding:10px 4px;}
body.forge .dayempty.dayadd:hover{background:#130b07;border-color:#3a2214;}
body.forge .daybox.dropok .dayempty.dayadd,body.forge .daybox.dropok{background:color-mix(in srgb,var(--go) 12%,#0e0805);}
body.forge .two-ctl{border-style:solid;border-color:#4a2c1c;background:#130c09;color:var(--txt2);}

/* ---- The ground, v5.141: the hearth (owner picked H, 14 Sep). ----
   Near black. One hearth sits low behind the board and its light rises to catch the plates'
   bottom edges. No drifting bloom, no bloom over the header, no anvil in the dark. Embers are
   fewer and stay near the hearth. Still one fixed layer painted once; only opacity breathes. */
html.forge{background:#070403;}
body.forge::before{
  background:
    radial-gradient(90% 55% at 50% 108%,rgba(255,120,30,.55) 0%,rgba(190,60,10,.22) 40%,transparent 70%),
    radial-gradient(140% 80% at 50% 120%,rgba(255,90,20,.14),transparent 60%),
    radial-gradient(150% 100% at 50% 40%,transparent 40%,rgba(4,2,1,.6) 100%),
    linear-gradient(180deg,#070403 0%,#0a0605 55%,#0d0705 100%);
  filter:none;}
body.forge #home::before{display:none;}
body.forge #bg > .bg-light{top:auto;bottom:-34vh;left:50%;width:120vw;height:70vw;max-width:none;max-height:none;   /* #bg > * sets inset:0 at id strength, so this needs the id too */
  background:radial-gradient(closest-side,rgba(255,120,30,.22),transparent 70%);
  animation:hearthbreath 5.2s ease-in-out infinite;transform:translateX(-50%);}
@keyframes hearthbreath{0%,100%{opacity:.5;}50%{opacity:.9;}}
body.forge .bg-wm svg{opacity:0;}
body.forge .bg-motes i:nth-child(n+15){display:none;}
body.forge .bg-motes i{animation-name:emberlow;}
@keyframes emberlow{
  0%{transform:translate3d(0,104vh,0) rotate(var(--ln,16deg)) scale(.5);opacity:0;}
  8%{opacity:1;}
  45%{transform:translate3d(calc(var(--dx,1) * 5vw),74vh,0) rotate(var(--ln,16deg)) scale(.9);opacity:.85;}
  75%{opacity:.4;}
  100%{transform:translate3d(calc(var(--dx,1) * 9vw),52vh,0) rotate(var(--ln,16deg)) scale(.7);opacity:0;}}
body.forge .bg-vig{background:radial-gradient(130% 100% at 50% 30%,transparent 45%,rgba(3,1,1,.7) 100%);}

/* ---- The board, v5.142: the agenda (owner picked K, 14 Sep). ----
   The day is a column on the left, three letters over the date, in the stamped style; the plate
   sits to its right and the column is exactly the plate's height, with the add tucked inside it.
   Today's column turns to embers. Empty days shrink to one thin row with a slim slot, still a
   place to tap or drop. A four-workout week fits one phone screen. */
body.forge .daybox{display:block;position:relative;padding:0 0 0 54px;margin:0 0 8px;}
body.forge .dayhead{position:absolute;left:0;top:0;bottom:0;width:46px;display:flex;flex-direction:column;align-items:stretch;padding:0;margin:0;box-sizing:border-box;
  border:1px solid #4a2c1c;border-radius:9px;background:#1a100b;}
body.forge .dayhead > span:first-child{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;margin:0;top:0;
  padding:4px 0 0;border:0;background:transparent;box-shadow:none;font-size:10px;line-height:1.15;letter-spacing:.14em;color:var(--txt2);}
body.forge .dayhead > span:first-child::before{display:none;}
body.forge .dh-n{font-weight:800;}
body.forge .dh-d{font-family:var(--mono);font-weight:500;font-size:14px;line-height:1.15;letter-spacing:0;color:var(--txt);margin-top:1px;}
body.forge .dayhead-add{display:flex;justify-content:center;align-items:center;height:16px;padding:0 0 3px;margin:0;color:var(--txt3);}
body.forge .dayhead-add svg{width:12px;height:12px;}
body.forge .daybox > .card{margin-bottom:6px;}
body.forge .daybox > .card:last-child{margin-bottom:0;}
body.forge .daybox.today .dayhead{background:#3a1d0c;border-color:#a0521c;box-shadow:0 0 14px -4px rgba(255,120,30,.6);}
body.forge .daybox.today .dayhead > span:first-child{background:transparent;border:0;box-shadow:none;color:#ffd9b5;}
body.forge .daybox.today .dh-d{color:#fff;}
body.forge .daybox.today .dayhead-add{color:#e0a874;}
body.forge .daybox.empty{min-height:46px;}
body.forge .daybox.empty .dayhead{background:#0f0906;border-color:#2a1810;}
body.forge .daybox.empty .dayhead > span:first-child{padding:4px 0;background:transparent;border:0;color:var(--txt3);}
body.forge .daybox.empty .dh-d{color:var(--txt3);}
body.forge .daybox.empty .dayempty.dayadd,body.forge .daybox.empty .dayempty.dayadd.quiet{padding:0;height:46px;margin:0;display:flex;align-items:center;justify-content:center;}
body.forge .daybox.quenched .dayhead{background:#171716;border-color:#343433;}
body.forge .daybox.quenched .dayhead > span:first-child{background:transparent;border:0;color:#84827f;}
body.forge .daybox.quenched .dh-d{color:#84827f;}

/* ---- The finish screen, v5.150: the seal. ---- */
#exportOvl .sheet.fin{background:#0a0605;border-color:#4a2718;}
.fin-plate{position:relative;overflow:hidden;border-radius:14px;padding:18px 16px 16px;background:linear-gradient(180deg,#1f130c,#120b08);border:1px solid #6a3f26;border-top-color:#8a5433;box-shadow:inset 0 1px 0 rgba(255,215,170,.16),0 16px 30px -16px rgba(0,0,0,.9);}
.fin-plate::before{content:'';position:absolute;left:0;top:0;bottom:0;width:6px;background:linear-gradient(180deg,#ffb35c,#ff7a1a 50%,#8a3f10);}
.fin-eyebrow{font-family:var(--mono);font-weight:600;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin:0;}
.fin-name{font-family:'Marcellus',serif;font-size:20px;font-weight:400;margin:4px 66px 0 0;color:#fff6e6;line-height:1.2;letter-spacing:.01em;text-transform:none;}
.fin-date{font-size:12px;color:var(--txt3);margin-top:2px;}
body.forge .sheet .fin-name,.sheet .fin-name{text-transform:none;letter-spacing:.01em;font-size:20px;}   /* the theme uppercases sheet headings; the workout name reads as written */
.fin-seal{position:absolute;right:14px;top:14px;width:50px;height:50px;border-radius:50%;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;transform:rotate(-12deg);box-shadow:0 0 16px -4px rgba(255,138,31,.7),inset 0 0 0 3px #120b08,inset 0 0 0 4px #6a3f26;}
.fin-seal svg{width:28px;height:28px;}
.fin-hero{display:flex;align-items:baseline;gap:8px;margin:16px 0 2px;}
.fin-hero b{font-family:var(--mono);font-weight:700;font-size:46px;color:#fff6e6;line-height:1;letter-spacing:-.03em;text-shadow:0 0 18px rgba(255,200,120,.5);}
.fin-hero span{font-family:var(--mono);font-weight:500;font-size:19px;letter-spacing:0;text-transform:none;color:var(--txt2);}
.fin-rec{margin-top:14px;border-radius:10px;padding:10px 12px;background:linear-gradient(90deg,rgba(255,138,31,.25),rgba(255,138,31,.05));border:1px solid #a0521c;display:flex;align-items:center;gap:10px;}
.fin-rec b{font-family:var(--mono);font-weight:700;font-size:22px;color:var(--gold);text-shadow:0 0 12px rgba(255,138,31,.7);}
.fin-rec span{font-size:12.5px;color:#fff6e6;}
.fin-rec small{margin-left:auto;font-size:11px;color:var(--txt2);text-align:right;line-height:1.3;}
.fin-rec{cursor:pointer;}
.fin-rec-chev{font-style:normal;font-size:20px;line-height:1;color:var(--gold);margin-left:8px;transition:transform .2s;}
.fin-rec.open .fin-rec-chev{transform:rotate(90deg);}
.fin-recs{margin-top:6px;border-radius:10px;background:#0e0806;border:1px solid #3a2214;padding:2px 12px;}
.fin-rr{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:baseline;padding:9px 0;border-bottom:1px solid #2a1810;}
.fin-rr:last-child{border-bottom:0;}
.fin-rr-n{font-size:13px;color:var(--txt);}
.fin-rr-now{font-family:var(--mono);font-weight:700;font-size:16px;color:var(--gold);text-shadow:0 0 10px rgba(255,138,31,.5);white-space:nowrap;}
.fin-rr-was{grid-column:2;font-family:var(--mono);font-size:11px;color:var(--txt3);text-align:right;white-space:nowrap;}
#finRecList[hidden]{display:none;}
.fin-lvl{position:relative;overflow:hidden;margin-top:12px;border-radius:12px;padding:13px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;color:#2a1608;
  background:linear-gradient(180deg,#fff0c8 0%,#ffd06a 26%,#e8a020 62%,#c27a10 100%);border:1px solid #fff2cf;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.85),inset 0 -2px 0 rgba(120,60,0,.35),0 0 22px rgba(255,190,60,.55),0 6px 14px -6px rgba(0,0,0,.6);}
.fin-lvl:active{transform:scale(.99);}
.fin-lvl b{display:block;font-size:16px;font-weight:800;letter-spacing:.04em;color:#2a1608;}
.fin-lvl .fin-x{display:inline;font-family:var(--mono);font-weight:700;color:#5a2e08;text-shadow:none;margin-left:2px;}
.fin-lvl small{display:block;font-size:11.5px;color:#5a3a14;margin-top:1px;}
.fin-go{margin-left:auto;font-size:26px;line-height:1;color:#5a2e08;font-weight:700;}
.fin-lvl::after{content:'';position:absolute;top:-30%;bottom:-30%;left:-30%;width:26%;transform:rotate(20deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);animation:finShine 3.6s ease-in-out infinite;pointer-events:none;}
@keyframes finShine{0%{left:-30%;}40%,100%{left:130%;}}
html.mo-off .fin-lvl::after{animation:none;display:none;}
.fin-note{font-size:12.5px;color:var(--txt2);margin:12px 2px 0;}
.fin-share{margin:14px 0 0;text-align:center;font-size:12px;color:var(--txt3);}
.fin-share span{cursor:pointer;padding:6px;}
.fin-share span:hover{color:var(--txt2);}
#finShareBox textarea{margin-top:8px;}
.fin-done{padding:14px;font-weight:800;letter-spacing:.16em;font-size:13px;background:linear-gradient(180deg,#ffb35c,#e0842f 60%,#b85d20);color:#1b0f06;border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,245,220,.7),0 0 24px -4px rgba(255,150,50,.6);}
#finRec[hidden],#finLvl[hidden],#sumNote[hidden],#finShareBox[hidden]{display:none;}

/* ---- The level-up sheet, v5.149: the banner (owner picked S, 15 Sep). ----
   A beam of light cuts the dark with LEVEL UP on it, rays behind. The lifts land one at a time
   beneath it, numbers counting up, the gain in green. Tap a row to raise that lift, tap its number
   to change it, RAISE ALL for the lot. */
#lvlOvl .sheet.lvl-s{position:relative;overflow:hidden;background:#0a0605;border-color:#4a2718;padding-top:30px;}
.lvl-glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(70% 30% at 50% 16%,rgba(255,150,50,.45),transparent 70%),radial-gradient(90% 55% at 50% 108%,rgba(255,120,30,.28),transparent 70%);}
.lvl-rays{position:absolute;left:-40%;right:-40%;top:-30%;height:90%;pointer-events:none;
  background:repeating-conic-gradient(from 0deg at 50% 40%,rgba(255,180,80,.16) 0deg 4deg,transparent 4deg 12deg);
  -webkit-mask-image:radial-gradient(60% 45% at 50% 40%,#000 20%,transparent 70%);mask-image:radial-gradient(60% 45% at 50% 40%,#000 20%,transparent 70%);
  animation:lvlRays 40s linear infinite;}
@keyframes lvlRays{to{transform:rotate(360deg);}}
.lvl-beam{position:relative;margin:0 -30px;padding:14px 32px 16px;text-align:center;transform:skewY(-2deg);
  background:linear-gradient(90deg,transparent,rgba(255,138,31,.85) 18%,rgba(255,208,138,.95) 50%,rgba(255,138,31,.85) 82%,transparent);
  box-shadow:0 0 40px rgba(255,150,50,.55),0 0 90px rgba(255,120,30,.35);animation:lvlBeam .6s cubic-bezier(.2,.8,.2,1) both;}
@keyframes lvlBeam{from{transform:skewY(-2deg) scaleX(.2);opacity:0;}to{transform:skewY(-2deg) scaleX(1);opacity:1;}}
.lvl-beam b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:30px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:#1b0f06;line-height:1;}
.lvl-beam small{display:block;font-family:var(--mono);font-weight:600;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:#3a1d0c;margin-top:6px;}
.lvl-list{position:relative;gap:0;margin:26px 2px 0;max-height:calc(var(--usablevh) * .46);}
.lvl-row{display:flex;align-items:center;gap:10px;padding:12px 4px;margin:0;border:0;border-radius:0;background:transparent;box-shadow:none;
  border-bottom:1px solid rgba(255,180,100,.14);cursor:pointer;opacity:.25;transform:translateY(8px);transition:opacity .35s,transform .35s,background .3s;}
.lvl-row::before{display:none;}
.lvl-row.landed{opacity:1;transform:none;}
.lvl-row:hover{background:rgba(255,138,31,.06);}
.lvl-n{flex:1;min-width:0;font-family:'Marcellus',serif;font-size:15px;font-weight:400;color:var(--txt);margin:0;white-space:normal;line-height:1.2;}
.lvl-nums{display:flex;flex-direction:column;align-items:flex-end;gap:2px;}
.lvl-num{display:inline-flex;align-items:baseline;gap:3px;font-family:var(--mono);font-weight:700;font-size:24px;color:#fff6e6;border-radius:7px;padding:0 4px;white-space:nowrap;}
.lvl-num small{font-size:10px;font-weight:500;color:var(--txt2);letter-spacing:.03em;}
.lvl-num.up:hover{background:rgba(255,138,31,.14);}
.lvl-gn{font-size:11px;font-weight:500;color:var(--txt3);font-style:normal;margin-right:3px;}
.lvl-row.lit .lvl-num{text-shadow:0 0 14px rgba(255,200,120,.85);animation:lvlPop .5s cubic-bezier(.3,1.6,.4,1) 1;}
@keyframes lvlPop{0%{transform:scale(1);}40%{transform:scale(1.14);}100%{transform:scale(1);}}
.lvl-gain{min-width:44px;text-align:right;font-family:var(--mono);font-weight:700;font-size:13px;color:#7fe0a8;text-shadow:0 0 10px rgba(127,224,168,.5);white-space:nowrap;}
.lvl-gain small{display:block;font-size:8.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--match,#a98ae6);text-shadow:none;}
.lvl-ok{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--gold);color:#1b0f06;font-size:12px;font-style:normal;box-shadow:0 0 12px rgba(255,138,31,.8);}
.lvl-row.done{cursor:default;}
.lvl-row.done .lvl-num{color:var(--gold);}
.lvl-row.xfer{background:linear-gradient(90deg,rgba(255,138,31,.25),transparent);}
.lvl-row.xfer .lvl-num{animation:lvlPop .5s cubic-bezier(.3,1.6,.4,1) 1;text-shadow:0 0 16px rgba(255,200,120,.95);}
.lvl-foot{position:relative;margin-top:22px;}
.lvl-go{width:100%;box-sizing:border-box;padding:14px;font-weight:800;letter-spacing:.16em;font-size:13px;
  background:linear-gradient(180deg,#ffb35c,#e0842f 60%,#b85d20);color:#1b0f06;border-color:transparent;
  box-shadow:inset 0 1px 0 rgba(255,245,220,.7),0 0 24px -4px rgba(255,150,50,.7);}
.lvl-hint{margin-top:10px;text-align:center;font-size:11.5px;color:var(--txt3);line-height:1.4;}
.lvl-skip{margin-top:10px;text-align:center;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--txt2);cursor:pointer;padding:11px;border:1px solid #5a3520;border-radius:12px;}
.lvl-skip:hover{color:var(--txt);border-color:#7a4c30;}
#lvlOvl.busy .lvl-foot,#lvlOvl.busy .lvl-row{pointer-events:none;}
html.mo-off .lvl-rays,html.mo-off .lvl-beam,html.mo-off .lvl-row.lit .lvl-num{animation:none;}
html.mo-off .lvl-row{opacity:1;transform:none;transition:none;}
@media (prefers-reduced-motion:reduce){.lvl-rays,.lvl-beam,.lvl-row.lit .lvl-num{animation:none;}.lvl-row{opacity:1;transform:none;transition:none;}}

.pill-done{background:transparent;border:1px solid color-mix(in srgb,var(--gold) 42%,transparent);color:var(--gold);
  display:inline-flex;align-items:center;gap:4px;}
.pill-done svg{width:10px;height:10px;stroke:currentColor;stroke-width:1.5;fill:none;stroke-linecap:round;}
body.light .card.sealed{background:var(--surface2);border-color:var(--line);}
body.light .card.sealed::after{opacity:.35;background:repeating-linear-gradient(135deg,rgba(60,72,96,.07) 0 2px,transparent 2px 6px);}
body.light .card.sealed .card-name,body.light .card.sealed .card-day{color:var(--txt2);}
body.light .pill-done{color:color-mix(in srgb,var(--gold) 66%,#0b1018);border-color:color-mix(in srgb,var(--gold) 55%,transparent);}

/* ---------- unseal: blue flame wipe ---------- */
.unsealbtn{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:8px;padding:15px 12px;border-radius:12px;cursor:pointer;transition:.16s;
  border:1px solid color-mix(in srgb,var(--go) 34%,var(--line));
  background:linear-gradient(180deg,color-mix(in srgb,var(--go) 9%,transparent),transparent),var(--surface);
  font-family:'Marcellus',serif;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--go);}
.unsealbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;}
.unsealbtn:hover{box-shadow:0 0 26px -10px color-mix(in srgb,var(--go) 85%,transparent);border-color:color-mix(in srgb,var(--go) 60%,transparent);}
.unsealbtn:active{transform:scale(.99);}
body.light .unsealbtn:hover{box-shadow:0 4px 14px -6px rgba(16,20,24,.2);}
.unsealbtn.idle{opacity:.42;}
.unsealbtn.idle:hover{opacity:.72;}

#wipe{display:none;position:fixed;inset:0;z-index:400;pointer-events:none;overflow:hidden;}
#wipe.on{display:block;}
#wcover{position:absolute;left:0;right:0;top:0;height:101%;transform:translateY(100%);
  background:linear-gradient(180deg,#071a3f 0%,#04102a 40%,#02050d 100%);}
body.light #wcover{background:linear-gradient(180deg,#04322f 0%,#021c1b 42%,#01090a 100%);}
#wipecv{position:absolute;left:0;top:0;width:100%;height:100%;mix-blend-mode:screen;}

/* ---------- history ---------- */
.hh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px;}
.hh h3{margin-bottom:0;}
.hseg{display:flex;gap:0;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex-shrink:0;}
.hsegb{padding:7px 12px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--txt3);cursor:pointer;background:transparent;transition:.15s;}
.hsegb:hover{color:var(--txt2);}
.hsegb.on{background:color-mix(in srgb,var(--go) 16%,transparent);color:var(--go);}
.hscroll{max-height:calc(var(--usablevh) * .56);overflow-y:auto;}
.hrow{display:flex;align-items:center;gap:11px;padding:12px 13px;border:1px solid var(--line);border-radius:11px;margin-bottom:6px;background:var(--surface);cursor:pointer;transition:.15s;}
.hrow:hover{border-color:color-mix(in srgb,var(--hc) 45%,var(--line));background:var(--surface2);}
.hrow-b{flex:1;min-width:0;}
.hrow-d{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--hc);}
.hrow-n{font-family:'Marcellus',serif;font-size:14.5px;color:var(--txt);margin-top:3px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hrow-m{font-family:var(--mono);font-size:10.5px;color:var(--txt3);margin-top:4px;}
.hrow-m .pr{color:var(--gold);}
.hrow-a{color:var(--txt3);font-size:15px;flex-shrink:0;}
/* A walk in the history list: the same card as a session, told apart quietly - gold date
   line, a dashed edge, and no chevron because there is no deeper page behind it. */
.hrow.hwalk{--hc:var(--gold);border-style:dashed;}
.hrow.hadd{justify-content:center;padding:10px 13px;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.12em;color:var(--txt3);margin-bottom:8px;}
.hrow.hadd:hover{color:var(--gold);}
.hcal-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
.hcal-t{font-family:'Marcellus',serif;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--txt);}
.hnav{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--txt2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;}
.hnav:hover{color:var(--txt);border-color:color-mix(in srgb,var(--go) 40%,var(--line));}
.hgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
/* the week strip: seven days, lit where something happened, gold where a record fell */
.hwk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px;}
.hwk-c{position:relative;border-radius:10px;border:1px solid transparent;padding:7px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--txt3);--hc:var(--go);}
.hwk-c i{font-style:normal;font-family:var(--mono);font-size:10px;letter-spacing:.08em;}
.hwk-c b{font-family:var(--mono);font-weight:500;font-size:15px;color:var(--txt2);}
.hwk-c.fut{opacity:.45;}
.hwk-c.has{background:var(--surface2);border-color:color-mix(in srgb,var(--hc) 45%,var(--line));cursor:pointer;}
.hwk-c.has b{color:var(--txt);}
.hwk-c.has::after{content:'';position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--hc);}
.hwk-c.pr::after{background:var(--gold);box-shadow:0 0 8px var(--gold);}
.hwk-c.walk{border-style:dashed;border-color:color-mix(in srgb,var(--gold) 40%,var(--line));cursor:pointer;}
.hwk-c.now{border-color:var(--txt3);}
.hwk-c.now i{color:var(--go);}
.hwk-c.sel{background:color-mix(in srgb,var(--go) 16%,transparent);border-color:var(--go);}
.hnav.off{opacity:.25;pointer-events:none;}
.hsub{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--txt3);margin:2px 0 10px;}
.hnone{color:var(--txt3);font-size:13.5px;padding:14px 4px 18px;text-align:center;}
/* the three numbers the week adds up to */
.hstat{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px;}
.hstat>div{background:var(--surface2);padding:12px 10px 11px;text-align:center;}
.hstat b{display:block;font-family:var(--mono);font-weight:500;font-size:24px;letter-spacing:-.03em;color:var(--txt);line-height:1.1;}
.hstat b small{font-size:11px;color:var(--txt3);letter-spacing:0;margin-left:4px;font-weight:400;}
.hstat b.gold{color:var(--gold);}
.hstat span{display:block;font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--txt3);margin-top:5px;}
.hdow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--txt3);text-align:center;padding:2px 0 4px;}
.hcell{position:relative;aspect-ratio:1;border-radius:9px;border:1px solid transparent;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:11px;color:var(--txt3);}
.hcell.pad{opacity:0;}
.hcell.has{background:var(--surface2);border-color:color-mix(in srgb,var(--hc) 40%,var(--line));color:var(--txt);cursor:pointer;transition:.15s;}
.hcell.has:hover{box-shadow:0 0 16px -6px color-mix(in srgb,var(--hc) 90%,transparent);}
.hcell.has::after{content:'';position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--hc);
  box-shadow:0 0 8px color-mix(in srgb,var(--hc) 80%,transparent);}
.hcell.now{border-color:var(--txt3);color:var(--txt);}
.hback{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--txt3);cursor:pointer;margin-bottom:14px;}
.hback:hover{color:var(--go);}
.hdet-n{font-family:'Marcellus',serif;font-size:17px;color:var(--txt);letter-spacing:.02em;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:12px;}
.hex{padding:9px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent);}
.hex-n{font-size:13px;color:var(--txt2);margin-bottom:6px;}
.hex-s{display:flex;flex-wrap:wrap;gap:5px;}
.hset{font-family:var(--mono);font-size:11px;color:var(--txt);background:var(--surface2);border:1px solid var(--line);border-radius:7px;padding:4px 8px;cursor:pointer;}
.hset.pr{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 45%,transparent);}
/* a chip mid-correction: the inputs take the chip's seat, sized like the builder's m/s pair */
.hset.hed{display:inline-flex;align-items:center;gap:5px;padding:3px 6px;cursor:default;}
.hset.hed i{font-style:normal;color:var(--txt3);font-size:11px;}
.hset.hed .mk-num.sm{font-size:13px;}
.hnote{margin-top:14px;font-size:12.5px;color:var(--txt3);line-height:1.6;font-style:italic;}
.hdel{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px;padding:13px;border-radius:11px;cursor:pointer;transition:.16s;
  border:1px solid color-mix(in srgb,#ff5d6c 26%,var(--line));background:var(--surface);
  font-family:'Marcellus',serif;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:color-mix(in srgb,#ff5d6c 78%,var(--txt2));}
.hdel svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;}
.hdel:hover{color:#ff5d6c;border-color:color-mix(in srgb,#ff5d6c 55%,transparent);background:color-mix(in srgb,#ff5d6c 7%,var(--surface));}
.hdel:active{transform:scale(.99);}

/* ---------- footer: a real panel, not fine print ---------- */
.footbar{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;}
.fbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  padding:15px 6px 13px;border-radius:12px;border:1px solid var(--line);cursor:pointer;transition:.16s;
  background:linear-gradient(180deg,rgba(190,214,255,.05),rgba(190,214,255,.008)),var(--surface);
  font-family:'Marcellus',serif;font-size:11.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--txt2);text-align:center;line-height:1.25;}
.fbtn svg{width:17px;height:17px;fill:none;stroke:var(--txt3);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;transition:.16s;}
.fbtn:hover{color:var(--txt);border-color:color-mix(in srgb,var(--go) 40%,var(--line));
  box-shadow:0 0 22px -12px color-mix(in srgb,var(--go) 80%,transparent);}
.fbtn:hover svg{stroke:var(--go);}
.fbtn:active{transform:scale(.985);}
.footnote{font-size:12.5px;color:var(--txt3);line-height:1.7;margin-top:16px;}
body.light .fbtn{background:var(--surface);box-shadow:0 1px 2px rgba(16,20,24,.05);}
body.light .fbtn:hover{box-shadow:0 4px 14px -6px rgba(16,20,24,.18);}

/* Forge footer: three plates set into the bench, not three soft cards. Corners come off
   almost square, the sheen turns from cold blue-white to firelight, and the top edge
   catches a hot line the way stock does lying near the coals. */
body.forge .footbar{gap:5px;}
body.forge .fbtn{border-radius:4px;padding:16px 6px 14px;
  background:linear-gradient(180deg,rgba(255,190,130,.055),rgba(255,150,70,.008)),var(--surface);
  border-color:#57301d;
  box-shadow:inset 0 1px 0 rgba(255,183,120,.13),inset 0 -1px 0 rgba(0,0,0,.4);
  font-family:'Big Shoulders Display','Barlow Condensed',sans-serif;
  font-size:14px;font-weight:700;letter-spacing:.17em;}
body.forge .fbtn svg{stroke-width:1.6;}
body.forge .fbtn:hover{border-color:color-mix(in srgb,var(--gold) 55%,#57301d);
  background:linear-gradient(180deg,rgba(255,190,130,.1),rgba(255,150,70,.02)),var(--surface2);
  box-shadow:inset 0 1px 0 rgba(255,196,140,.22),0 0 20px -10px rgba(255,138,31,.9);}
body.forge .fbtn:hover svg{stroke:var(--gold);}
/* the unseal sits in the same panel as the plates and has to be cut from the same stock */
body.forge .unsealbtn{border-radius:4px;font-size:14px;letter-spacing:.17em;
  border-color:color-mix(in srgb,var(--gold) 30%,#57301d);
  background:linear-gradient(180deg,rgba(255,150,60,.09),rgba(255,150,70,.01)),var(--surface);
  box-shadow:inset 0 1px 0 rgba(255,183,120,.13),inset 0 -1px 0 rgba(0,0,0,.4);
  color:var(--gold);}
body.forge .unsealbtn:hover{border-color:color-mix(in srgb,var(--gold) 60%,#57301d);
  box-shadow:inset 0 1px 0 rgba(255,196,140,.22),0 0 24px -10px rgba(255,138,31,.9);}
body.forge .footnote{font-family:'Barlow',system-ui,sans-serif;}
body.forge .storenote{font-family:'Barlow',system-ui,sans-serif;}
/* the side doors are struck plates too, not pebbles */
body.forge .side{border-radius:5px;
  box-shadow:inset 0 1px 0 rgba(255,183,120,.14),inset 0 -1px 0 rgba(0,0,0,.45);}

/* ---------- sandbox ---------- */
#sbxBar{display:none;position:fixed;left:0;right:0;top:0;z-index:150;
  align-items:center;gap:9px;padding:calc(7px + env(safe-area-inset-top,0px)) 14px 7px;
  background:color-mix(in srgb,var(--gold) 16%,#120a05);
  border-bottom:1px solid color-mix(in srgb,var(--gold) 42%,transparent);
  font-size:11.5px;letter-spacing:.14em;color:var(--gold);}
body.sbx #sbxBar{display:flex;}
.sbx-dot{width:7px;height:7px;border-radius:50%;background:var(--gold);flex:0 0 auto;
  box-shadow:0 0 8px var(--gold);animation:sbxpulse 2.2s ease-in-out infinite;}
@keyframes sbxpulse{0%,100%{opacity:.45;}50%{opacity:1;}}
.sbx-txt{flex:1 1 auto;}
.sbx-out{flex:0 0 auto;padding:3px 10px;border-radius:6px;cursor:pointer;
  border:1px solid color-mix(in srgb,var(--gold) 55%,transparent);}
/* The bar is fixed, so the board has to be pushed out from under it - and the sheets sit above
   it at z-index 200, which is right: inside a sheet the bar is not the thing you are reading. */
body.sbx #home{padding-top:calc(52px + env(safe-area-inset-top,0px));}
/* #home was the only thing that made room for the banner. Every other full screen - the day
   builder, a session - has its own sticky .s-head with the back button in it, and the banner sat
   straight over the top of it: in the sandbox the only way out of the builder was the phone's own
   back gesture. The banner is fixed over everything, so everything with a head has to duck. */
body.sbx .s-head{padding-top:calc(52px + env(safe-area-inset-top,0px));}
@media(prefers-reduced-motion:reduce){.sbx-dot{animation:none;opacity:.85;}}

/* ---------- launch ---------- */
/* FIFTH answer on this box, and the first one that names what actually moves.
   Pinned edges were right about the BOX and that is not what bumps. Everything inside the
   launch is centred, and centring is a halving machine: whatever the box does vertically,
   the mark does half of it. Android hands the WebView a full-screen viewport, puts the system
   bars back a moment later, and the window shrinks - which the note further down already had
   written out. Pin to that window with bottom:0 and the box faithfully follows the shrink, so
   the mark rises by half of whatever the bars take. Measured in the browser at the two heights:
   72px off the window moves the mark up 36px. Exactly half, every time.
   So the fix is not a better pin, it is a height that does not move. This app is cover-fit -
   see the note on --vh at the top of :root - so vh is the whole panel INCLUDING the strips
   behind the bars, and it does not change when they land. innerHeight does; vh does not.
   Centring against the panel instead of against the window gives the mark one position from
   the first frame, and the bars arriving over the bottom of a box that is flat colour there
   anyway is not something the eye can see. overflow:hidden stays, so any overshoot is clipped
   rather than scrolled. */
#splash{position:fixed;left:0;top:0;right:0;height:100vh;height:100dvh;z-index:200;background:#04050a;perspective:1700px;perspective-origin:0% 50%;transition:background-color .4s ease .34s;}
#splash.out{pointer-events:none;background:transparent;}
.sp-leaf{position:absolute;inset:0;transform-origin:left center;
  background:linear-gradient(100deg,var(--surface2) 0%,var(--surface) 44%,#0a0c14 100%);
  box-shadow:16px 0 22px rgba(0,0,0,.55);
  transition:transform .74s cubic-bezier(.46,.03,.3,1);}
.sp-leaf::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,rgba(198,224,255,.10),rgba(198,224,255,.02) 34%,transparent 60%);}
.sp-leaf.l1{z-index:3;transition-delay:.20s;}
.sp-leaf.l2{z-index:2;transition-delay:.32s;}
.sp-leaf.l3{z-index:1;transition-delay:.42s;}
#splash.out .sp-leaf{transform:rotateY(-118deg);}
#splash.out .sp-leaf.l2{transform:rotateY(-112deg);}
#splash.out .sp-leaf.l3{transform:rotateY(-104deg);}
.sp-board{z-index:4;position:absolute;inset:0;transform-origin:left center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  background:radial-gradient(125% 105% at 34% 16%,#1b2038 0%,#0d1020 48%,#05060c 100%);
  box-shadow:inset 0 0 90px rgba(0,0,0,.72),18px 0 36px rgba(0,0,0,.5);
  transition:transform .92s cubic-bezier(.5,.04,.28,1),opacity .34s ease .58s;}
#splash.out .sp-board{transform:rotateY(-112deg);opacity:0;}
.sp-board::before{content:'';position:absolute;top:0;bottom:0;left:0;width:26px;background:linear-gradient(90deg,rgba(0,0,0,.88),rgba(0,0,0,.12));border-right:1px solid rgba(240,201,107,.18);}
.sp-board::after{content:'';position:absolute;left:50%;top:14%;width:560px;height:420px;transform:translateX(-50%);pointer-events:none;
  background:radial-gradient(closest-side,rgba(111,217,255,.16),rgba(96,84,214,.10) 50%,transparent 72%);}
.sp-frame{position:relative;display:flex;flex-direction:column;align-items:center;gap:20px;padding:46px 40px;width:min(276px,84vw);
  border:1px solid rgba(240,201,107,.36);box-shadow:0 0 0 5px rgba(0,0,0,0),inset 0 0 0 5px rgba(0,0,0,0);}
.sp-frame::before{content:'';position:absolute;inset:6px;border:1px solid rgba(240,201,107,.15);pointer-events:none;}
.sp-mark{width:96px;height:96px;overflow:visible;}
/* The serpent draws itself as an outline, fills, and only then does the world's glyph
   arrive in the middle. Same order as the header mark builds in. */
.sp-mark .o path{stroke:var(--gold);stroke-width:1.1;fill:none;stroke-dasharray:900;stroke-dashoffset:900;animation:draw 1.05s cubic-bezier(.4,0,.2,1) forwards;}
/* The serpent comes round to where it started. The whole ring swirls into place, and as it
   settles the head alone pulls back off the tail and snaps at it once. Head, mouth and eye
   are the 2nd, 3rd and 4th children of the filled group - the body is the 1st and stays put. */
.sp-mark .o,.sp-mark .f{transform-box:view-box;transform-origin:50px 50px;}
.sp-mark .o{animation:swirl 2.5s cubic-bezier(.24,.68,.2,1) .12s both;}
.sp-mark .f > *:nth-child(n+2){transform-box:view-box;transform-origin:50px 50px;
  animation:bite 1.5s cubic-bezier(.3,.7,.25,1) 1.5s both;}
/* the outline head has to strike with the filled one, or the stroke stays behind as a
   second head - and it keeps its own draw-on, so both animations are listed here */
.sp-mark .o > *:nth-child(n+2){transform-box:view-box;transform-origin:50px 50px;
  animation:draw 1.05s cubic-bezier(.4,0,.2,1) forwards,bite 1.5s cubic-bezier(.3,.7,.25,1) 1.5s both;}
@keyframes swirl{
  0%{transform:rotate(-38deg);}
  64%{transform:rotate(5deg);}
  82%{transform:rotate(-2deg);}
  100%{transform:rotate(0deg);}}
@keyframes bite{
  0%,22%{transform:rotate(0deg);}
  52%{transform:rotate(-6deg);}
  80%{transform:rotate(5deg);}
  100%{transform:rotate(0deg);}}
.sp-mark .f{opacity:0;animation:fadein .6s ease .72s forwards,swirl 2.5s cubic-bezier(.24,.68,.2,1) .12s both;}
.sp-mark .f path,.sp-mark .f circle{fill:var(--gold);}
.sp-mark .f .cut{fill:var(--bg);}
.sp-mark .i{color:var(--go);filter:drop-shadow(0 0 12px rgba(240,201,107,.5));opacity:0;transform-origin:50px 50px;animation:bloom .5s cubic-bezier(.34,1.3,.64,1) 1.0s forwards;}
.sp-mark .gy{display:none;}
.sp-mark .gy-dark{display:block;}
html.light .sp-mark .gy-dark,html.forge .sp-mark .gy-dark,html.moon .sp-mark .gy-dark{display:none;}
html.light .sp-mark .gy-light{display:block;}
html.forge .sp-mark .gy-forge{display:block;}
html.moon .sp-mark .gy-moon{display:block;}
@keyframes fadein{to{opacity:1;}}
@keyframes draw{to{stroke-dashoffset:0;}}
@keyframes bloom{from{opacity:0;transform:scale(.3);}to{opacity:.85;transform:scale(1);}}
/* Both carry an explicit numeric line-height, and that is the whole point of them having one.
   Without it a line box is as tall as the font in it says it is, so the wordmark stood 45px in
   the fallback and 38px once Big Shoulders Display arrived - the framed box sizes to its text,
   so it shrank by seven pixels and everything inside it moved. That is the bump on the launch.
   fready above already holds the words hidden until the fonts land, which covers the fast case
   and was doing so all along; what it cannot cover is its own 700ms ceiling, and a phone asking
   Google for three families goes past that regularly. Then the words appear in the fallback and
   the swap lands afterwards, in full view. A line box measured in ems instead of in font metrics
   is the same height whichever font wins the race, so the ceiling firing early stops mattering.
   The glyphs still change width; the frame is a fixed width and the text is centred in it, so
   that resolves symmetrically rather than as a jump. */
.sp-word{font-family:'Marcellus',serif;font-size:26px;line-height:1.2;text-shadow:0 1px 0 rgba(0,0,0,.6);letter-spacing:.5em;text-indent:.5em;text-transform:uppercase;color:var(--txt);opacity:0;white-space:nowrap;}
.sp-tag{font-family:var(--mono);font-size:10px;line-height:1.4;letter-spacing:.22em;text-transform:uppercase;color:var(--txt3);opacity:0;white-space:nowrap;}
html.fready .sp-word{animation:spin2 .7s ease .28s forwards;}
html.fready .sp-tag{animation:spin2 .7s ease .48s forwards;}
@keyframes spin2{from{opacity:0;letter-spacing:.62em;}to{opacity:1;}}
.sp-rule{width:132px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:0;}
html.fready .sp-rule{animation:spin2 .6s ease .62s forwards;}
body.light .card,body.light .exc,body.light .sheet,body.light .timer-pill{background:var(--surface);border-top-color:var(--line);}
body.light{--sans:'Libre Franklin',system-ui,sans-serif;--mono:'Courier Prime',ui-monospace,monospace;}
body.light .sp-word,body.light .sheet h3,body.light .ed-ex,body.light .hrow-n,body.light .hdet-n{font-family:'Libre Franklin',system-ui,sans-serif;font-weight:600;}
/* Courier Prime is wide and light - figures need a shade more weight and less tracking to
   hold their own against the mono the other themes use */
body.light .num,body.light .inp,body.light .ttime,body.light .sum-n,body.light .ed-big{font-weight:700;letter-spacing:-.02em;}
body.light .card-day,body.light .pill,body.light .hsegb,body.light .hrow-d{font-weight:700;}
/* frost mode: day accents are tuned for obsidian, so darken them onto the pale ground */
body.light .card-day,body.light .s-sub b,body.light .sect-t .ss{color:color-mix(in srgb,var(--c) 50%,#0b1018);}
body.light .btn-c{color:color-mix(in srgb,var(--c) 50%,#0b1018);border-color:color-mix(in srgb,var(--c) 45%,var(--line));}
/* the warm red washes out on a pale ground and reads orange in the forge - both get a shade
   that sits against their own background */
body.light .btn-bad{--bad:#b1332c;}
body.forge .btn-bad{--bad:#f0645a;}
body.light .pill-today{background:color-mix(in srgb,var(--c) 50%,#0b1018);color:#fff;}
/* a glow does nothing on a pale ground, so Frost marks today by weight of tint instead */
body.light .card.today{background:color-mix(in srgb,var(--c) 15%,var(--surface));
  border-color:color-mix(in srgb,var(--c) 45%,var(--line));box-shadow:none;}

body.light .card.today .card-day{text-shadow:none;}
body.light .ring .bar{stroke:color-mix(in srgb,var(--c) 50%,#0b1018);}
body.light .ring .bar,body.light .ring.full .bar{filter:none;}
body.light .inp[readonly]:hover{border-bottom-color:color-mix(in srgb,var(--c) 50%,#0b1018);}
body.light .card:hover{box-shadow:0 4px 14px -4px rgba(16,20,24,.16);}

/* ---------- Moonwell launch: the camera looks up ----------
   The board sinks out of frame while the sky above it comes down, and the moon that was
   overhead the whole time rises into view. The leaves travel further than the board so
   the fall reads as parallax rather than a card sliding. */
.sp-moon{display:none;}
html.moon .sp-moon,body.moon .sp-moon{display:block;position:absolute;z-index:2;left:50%;top:24%;
  width:min(184px,44vw);height:min(184px,44vw);margin-left:calc(min(184px,44vw) / -2);border-radius:50%;opacity:0;
  background:radial-gradient(circle at 38% 32%,#fdf7e6 0%,#f2e4bb 40%,#d9c68f 68%,#b6a173 100%);
  box-shadow:0 0 44px 12px rgba(240,224,176,.30),0 0 140px 46px rgba(150,130,220,.20);}
html.moon .sp-moon::after,body.moon .sp-moon::after{content:'';position:absolute;inset:0;border-radius:50%;opacity:.5;
  background:radial-gradient(circle at 62% 26%,rgba(120,104,74,.30) 0 8%,transparent 9%),
             radial-gradient(circle at 34% 58%,rgba(120,104,74,.26) 0 12%,transparent 13%),
             radial-gradient(circle at 66% 68%,rgba(120,104,74,.20) 0 6%,transparent 7%);}
html.moon #splash.out .sp-moon,body.moon #splash.out .sp-moon{animation:moonrise 1.35s cubic-bezier(.32,0,.18,1) forwards;}
@keyframes moonrise{
  0%{transform:translateY(-150%) scale(.78);opacity:0;}
  14%{opacity:1;}
  62%{transform:translateY(0) scale(1);opacity:1;}
  100%{transform:translateY(7%) scale(1.03);opacity:0;}}
html.moon #splash.out .sp-board,body.moon #splash.out .sp-board{transform:translateY(52%) scale(1.01);opacity:0;}
html.moon .sp-board,body.moon .sp-board{transition:transform 1.02s cubic-bezier(.52,0,.5,1),opacity .5s ease .42s;}
html.moon #splash.out .sp-leaf,html.moon #splash.out .sp-leaf.l2,html.moon #splash.out .sp-leaf.l3,
body.moon #splash.out .sp-leaf,body.moon #splash.out .sp-leaf.l2,
body.moon #splash.out .sp-leaf.l3{transform:translateY(88%);opacity:0;}
/* hold the night sky until the moon has had its moment, then let it go */
html.moon #splash,body.moon #splash{transition:background-color .38s ease 1s;}

/* ---------- Tundra launch: the wind takes it ----------
   Not a flake settling any more. Everything braces against the gust for a moment, then is
   carried off across the ice - low, fast, and away to the side rather than down. */
html.light #splash.out .sp-board,body.light #splash.out .sp-board{animation:gust 1.15s cubic-bezier(.5,.02,.35,1) forwards;}
html.light #splash.out .sp-leaf,body.light #splash.out .sp-leaf{animation:gust 1.02s cubic-bezier(.5,.02,.35,1) .04s forwards;}
html.light #splash.out .sp-leaf.l2,body.light #splash.out .sp-leaf.l2{animation:gust2 1.1s cubic-bezier(.5,.02,.35,1) .09s forwards;}
html.light #splash.out .sp-leaf.l3,body.light #splash.out .sp-leaf.l3{animation:gust 1.2s cubic-bezier(.5,.02,.35,1) .14s forwards;}
/* downwind is to the left, the same way the swirls and the snow run on the board */
@keyframes gust{
  0%{transform:translate(0,0) rotate(0deg) scale(1);opacity:1;}
  14%{transform:translate(3.5%,.6%) rotate(1.4deg) scale(1.005);opacity:1;}
  46%{transform:translate(-24%,-2.4%) rotate(-3.2deg) scale(.97);opacity:.9;}
  100%{transform:translate(-142%,-7%) rotate(-7deg) scale(.9);opacity:0;}}
@keyframes gust2{
  0%{transform:translate(0,0) rotate(0deg) scale(1);opacity:1;}
  16%{transform:translate(4.5%,1.4%) rotate(-1.6deg) scale(1.005);opacity:1;}
  50%{transform:translate(-28%,2.6%) rotate(2.6deg) scale(.965);opacity:.86;}
  100%{transform:translate(-150%,6%) rotate(6deg) scale(.88);opacity:0;}}
html.light #splash,body.light #splash{transition:background-color .4s ease .6s;background:#e4eaf1;}
html.light #splash.out,body.light #splash.out{background:transparent;}
/* Tundra is the one theme lit from outside. The splash used to inherit Obsidian's night
   board, which is why the lettering was unreadable on it - it is now overcast light on snow,
   with the ink and shadows inverted to match. */
html.light .sp-board,body.light .sp-board{
  background:radial-gradient(125% 105% at 38% 14%,#ffffff 0%,#e9eef5 46%,#cfd8e4 100%);
  box-shadow:inset 0 0 90px rgba(120,140,165,.16),18px 0 36px rgba(120,140,165,.22);}
html.light .sp-board::after,body.light .sp-board::after{background:radial-gradient(closest-side,rgba(120,150,190,.16),transparent 70%);}
html.light .sp-leaf,body.light .sp-leaf{
  background:linear-gradient(100deg,#f4f7fb 0%,#e7edf4 44%,#cbd5e2 100%);
  box-shadow:16px 0 22px rgba(120,140,165,.28);}
html.light .sp-leaf::after,body.light .sp-leaf::after{background:linear-gradient(100deg,rgba(255,255,255,.6),rgba(255,255,255,.15) 34%,transparent 60%);}
html.light .sp-word,body.light .sp-word{color:#1c2430;text-shadow:0 1px 0 rgba(255,255,255,.8);}
html.light .sp-tag,body.light .sp-tag{color:#5b6a7d;}
html.light .sp-mark .cut,body.light .sp-mark .cut{fill:#e9eef5;}

/* ===== LAUNCH ===== rebuilt, sixth time lucky, and this one has no moving parts.
   What was here was a three-dimensional page turn: a perspective on #splash, three leaves and a
   board rotating on rotateY, a serpent drawing itself along a dash offset, a swirl and a bite,
   all of it centred in a box that Android resizes underneath during the first sixty
   milliseconds. Six builds went into keeping that still. It never was.
   So it is gone, and this replaces it. One flat panel, the mark, a rule, the word. Everything
   that arrives does so on opacity and a few pixels of transform - no perspective, no rotation,
   no masks, no blur - and it exits on a fade rather than a turn. There is nothing left in it
   whose position depends on the height of the window, which is the whole point: a launch that
   cannot bump because there is no geometry for the window to move.
   The mark, the rule and the caps wordmark are the same three things the welcome screen uses,
   in the same order, so the app opens and asks its first question in one voice.
   .sp-* below is what the old launch was made of. It is hidden rather than deleted because the
   other three themes still style it and they are shut until v5.0 - untangling their overrides
   is that piece of work, not this one. Nothing renders it: the elements carry hidden. */
#splash{display:flex;align-items:center;justify-content:center;}
/* The hidden attribute is display:none in the UA sheet and ANY author display rule beats it -
   .sp-board carries display:flex, so marking it hidden did nothing at all and the old board went
   on rendering underneath the new launch. Caught on the phone: the trace was still reporting a
   298px frame for a thing that was supposed to be gone. Stated with the id so it also outranks
   the per-theme #splash.out overrides, which are the other place these are switched about. */
#splash .sp-moon,#splash .sp-leaf,#splash .sp-board{display:none;}
.lx-in{display:flex;flex-direction:column;align-items:center;text-align:center;
  transition:opacity .34s ease,transform .34s cubic-bezier(.4,0,.6,1);}
#splash.out .lx-in{opacity:0;transform:scale(1.045);}
.lx-logo{color:var(--gold);line-height:0;
  filter:drop-shadow(0 0 20px color-mix(in srgb,var(--gold) 42%,transparent));
  opacity:0;animation:lxIn .52s cubic-bezier(.2,.7,.3,1) .06s both;}
.lx-rule{width:0;height:1px;margin:21px 0 17px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  animation:lxRule .5s cubic-bezier(.3,.7,.3,1) .34s both;}
.lx-word{font-family:'Big Shoulders Display','Barlow Condensed',var(--sans);font-weight:800;
  font-size:31px;line-height:1.2;letter-spacing:.3em;text-indent:.3em;text-transform:uppercase;
  color:var(--txt);opacity:0;animation:lxIn .5s cubic-bezier(.2,.7,.3,1) .46s both;}
/* The ember the mark is standing on. Static - it is a light source, not an effect. */
#splash::after{content:'';position:absolute;left:50%;bottom:-14%;width:min(150vw,620px);
  height:min(80vw,340px);transform:translateX(-50%);pointer-events:none;border-radius:50%;
